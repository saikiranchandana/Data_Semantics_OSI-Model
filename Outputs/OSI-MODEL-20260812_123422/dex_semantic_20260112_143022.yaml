          - name: usd_rate
            business_name: USD Rate
            description: Exchange rate from the currency to USD.
            sql_type: NUMERIC(12,6)
            constraints:
              - NOT NULL

    relationships:
      - name: customers_to_orders
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Multiple orders can be placed by the same customer. Join orders to 
          customers using customer_id equality.
      
      - name: orders_to_stores
        left_dataset: orders
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Multiple orders can be fulfilled by the same store. Join orders to 
          stores using store_id equality.
      
      - name: orders_to_order_items
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. One order contains multiple order line items. Join order_items to 
          orders using order_id equality. WARNING: Do not sum order-level measures (orders.total_amount_usd, 
          orders.total_cost_usd) after this join as it will duplicate the order-level values by the number of 
          line items.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Multiple order items can reference the same product. Join order_items 
          to products using product_id equality.
      
      - name: products_to_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Multiple products belong to the same category. Join products to 
          product_categories using category_id equality.
      
      - name: products_to_suppliers
        left_dataset: products
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Multiple products are supplied by the same supplier. Join products 
          to suppliers using supplier_id equality.
      
      - name: shipments_to_suppliers
        left_dataset: shipments
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Multiple shipments originate from the same supplier. Join shipments 
          to suppliers using supplier_id equality.
      
      - name: shipments_to_stores
        left_dataset: shipments
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Multiple shipments are received by the same store. Join shipments 
          to stores using store_id equality.
      
      - name: shipments_to_shipment_items
        left_dataset: shipment_items
        right_dataset: shipments
        relationship_type: many_to_one
        join:
          left:
            - shipment_id
          right:
            - shipment_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. One shipment contains multiple shipment line items. Join shipment_items 
          to shipments using shipment_id equality. WARNING: Do not sum shipment-level measures (shipments.freight_cost_usd) 
          after this join as it will duplicate the shipment-level values by the number of line items.
      
      - name: shipment_items_to_products
        left_dataset: shipment_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Multiple shipment items reference the same product. Join shipment_items 
          to products using product_id equality.
      
      - name: customer_account_managers_to_customers
        left_dataset: customer_account_managers
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Multiple account manager assignments can exist for the same customer 
          across different time periods. Join customer_account_managers to customers using customer_id equality.
      
      - name: customer_account_managers_to_employees
        left_dataset: customer_account_managers
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - employee_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Multiple customer assignments reference the same employee. Join 
          customer_account_managers to employees using employee_id equality.
      
      - name: employees_hierarchy
        left_dataset: employees
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - manager_id
          right:
            - employee_id
        join_type: recursive
        resolution: >-
          Recursive self-referencing relationship supporting organizational hierarchy. An employee's manager_id 
          references another employee's employee_id. Use recursive CTEs to traverse the complete management chain. 
          Example: WITH RECURSIVE management_chain AS (SELECT employee_id, employee_name, manager_id, 1 AS level 
          FROM employees WHERE employee_id = <target_employee_id> UNION ALL SELECT e.employee_id, e.employee_name, 
          e.manager_id, mc.level + 1 FROM employees e INNER JOIN management_chain mc ON e.employee_id = mc.manager_id) 
          SELECT * FROM management_chain;
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: recursive
        resolution: >-
          Recursive self-referencing relationship supporting category hierarchy. A category's parent_category_id 
          references another category's category_id. Use recursive CTEs to traverse the complete category hierarchy. 
          Example: WITH RECURSIVE category_hierarchy AS (SELECT category_id, category_name, parent_category_id, 
          1 AS level FROM product_categories WHERE parent_category_id IS NULL UNION ALL SELECT pc.category_id, 
          pc.category_name, pc.parent_category_id, ch.level + 1 FROM product_categories pc INNER JOIN category_hierarchy 
          ch ON pc.parent_category_id = ch.category_id) SELECT * FROM category_hierarchy;
      
      - name: orders_to_customer_account_managers_scd
        left_dataset: orders
        right_dataset: customer_account_managers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
            - order_date
          right:
            - customer_id
            - valid_from
            - valid_to
        join_type: scd_type2_date_range
        resolution: >-
          SCD Type-2 temporal relationship. Join orders to customer_account_managers using customer_id and temporal 
          validity logic: orders.customer_id = customer_account_managers.customer_id AND orders.order_date >= 
          customer_account_managers.valid_from AND orders.order_date < COALESCE(customer_account_managers.valid_to, 
          '9999-12-31'::date). This retrieves the account manager assignment effective on the order date. Multiple 
          assignment records may exist for the same customer across different time periods.
      
      - name: orders_to_exchange_rates_asof
        left_dataset: orders
        right_dataset: exchange_rates
        relationship_type: many_to_one
        join:
          left:
            - currency_code
            - order_date
          right:
            - currency_code
            - rate_date
        join_type: as_of
        resolution: >-
          As-of temporal relationship. Join orders to exchange_rates using currency_code and as-of date logic: 
          orders.currency_code = exchange_rates.currency_code AND exchange_rates.rate_date <= orders.order_date::date 
          ORDER BY exchange_rates.rate_date DESC LIMIT 1. This retrieves the most recent exchange rate effective 
          on or before the order date.

    metrics:
      - name: total_revenue_usd
        business_name: Total Revenue USD
        description: >-
          Total order revenue in USD. Aggregates the total_amount_usd field from the orders dataset. Use this 
          metric for order-level revenue analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) AS total_revenue_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
      
      - name: total_cost_usd
        business_name: Total Cost USD
        description: >-
          Total order cost in USD. Aggregates the total_cost_usd field from the orders dataset. Use this metric 
          for order-level cost analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_cost_usd) AS total_cost_usd
                FROM orders
              columns_used:
                - orders.total_cost_usd
      
      - name: gross_profit_usd
        business_name: Gross Profit USD
        description: >-
          Gross profit in USD calculated as total revenue minus total cost. Computed as SUM(orders.total_amount_usd) - 
          SUM(orders.total_cost_usd). Use this metric for order-level profitability analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd) AS gross_profit_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross margin percentage calculated as (gross profit / total revenue) * 100. Computed as 
          ((SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd)) / NULLIF(SUM(orders.total_amount_usd), 0)) * 100. 
          Returns 0 when total revenue is 0 to avoid division by zero.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(orders.total_amount_usd) = 0 THEN 0
                        ELSE
                            (
                                (SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd))
                                / NULLIF(SUM(orders.total_amount_usd), 0)
                            ) * 100
                    END AS gross_margin_pct
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders. Counts the order_id field from the orders dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(orders.order_id) AS order_count
                FROM orders
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of unique customers. Counts distinct customer_id from the customers dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM customers
              columns_used:
                - customers.customer_id
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of unique products. Counts distinct product_id from the products dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT products.product_id) AS product_count
                FROM products
              columns_used:
                - products.product_id
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold. Aggregates the quantity field from the order_items dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.quantity) AS units_sold
                FROM order_items
              columns_used:
                - order_items.quantity
      
      - name: average_order_value_usd
        business_name: Average Order Value USD
        description: >-
          Average order value in USD. Calculated as total revenue divided by order count. Computed as 
          SUM(orders.total_amount_usd) / NULLIF(COUNT(orders.order_id), 0).
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(orders.order_id), 0) AS average_order_value_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.order_id
      
      - name: average_discount_pct
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across order line items. Calculated as the simple average of discount_pct 
          from the order_items dataset.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(order_items.discount_pct) AS average_discount_pct
                FROM order_items
              columns_used:
                - order_items.discount_pct
      
      - name: total_freight_cost_usd
        business_name: Total Freight Cost USD
        description: >-
          Total freight cost in USD. Aggregates the freight_cost_usd field from the shipments dataset. Use this 
          metric for shipment-level freight cost analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipments.freight_cost_usd) AS total_freight_cost_usd
                FROM shipments
              columns_used:
                - shipments.freight_cost_usd
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments. Counts the shipment_id field from the shipments dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS shipment_count
                FROM shipments
              columns_used:
                - shipments.shipment_id
      
      - name: units_shipped
        business_name: Units Shipped
        description: >-
          Total number of product units shipped. Aggregates the quantity field from the shipment_items dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipment_items.quantity) AS units_shipped
                FROM shipment_items
              columns_used:
                - shipment_items.quantity
      
      - name: product_line_revenue_usd
        business_name: Product Line Revenue USD
        description: >-
          Total product line revenue in USD. Aggregates the line_revenue_usd field from the order_items dataset. 
          Use this metric for product-level or order-line-level revenue analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_revenue_usd) AS product_line_revenue_usd
                FROM order_items
              columns_used:
                - order_items.line_revenue_usd
      
      - name: product_line_cost_usd
        business_name: Product Line Cost USD
        description: >-
          Total product line cost in USD. Aggregates the line_cost_usd field from the order_items dataset. Use 
          this metric for product-level or order-line-level cost analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_cost_usd) AS product_line_cost_usd
                FROM order_items
              columns_used:
                - order_items.line_cost_usd
      
      - name: product_line_profit_usd
        business_name: Product Line Profit USD
        description: >-
          Total product line profit in USD. Calculated as product line revenue minus product line cost. Computed 
          as SUM(order_items.line_revenue_usd) - SUM(order_items.line_cost_usd).
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_revenue_usd) - SUM(order_items.line_cost_usd) AS product_line_profit_usd
                FROM order_items
              columns_used:
                - order_items.line_revenue_usd
                - order_items.line_cost_usd
      
      - name: returned_order_count
        business_name: Returned Order Count
        description: >-
          Total number of returned orders. Counts orders where is_returned is true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(orders.order_id) AS returned_order_count
                FROM orders
                WHERE orders.is_returned = true
              columns_used:
                - orders.order_id
                - orders.is_returned
      
      - name: return_rate_pct
        business_name: Return Rate Percentage
        description: >-
          Percentage of orders that were returned. Calculated as (returned order count / total order count) * 100. 
          Computed as (COUNT(CASE WHEN orders.is_returned = true THEN 1 END) / NULLIF(COUNT(orders.order_id), 0)) * 100.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    (
                        COUNT(CASE WHEN orders.is_returned = true THEN 1 END)::NUMERIC
                        / NULLIF(COUNT(orders.order_id), 0)
                    ) * 100 AS return_rate_pct
                FROM orders
              columns_used:
                - orders.is_returned
                - orders.order_id
      
      - name: average_customer_rating
        business_name: Average Customer Rating
        description: >-
          Average customer rating across orders. Calculated as the simple average of customer_rating from the 
          orders dataset where customer_rating is not null.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(orders.customer_rating) AS average_customer_rating
                FROM orders
                WHERE orders.customer_rating IS NOT NULL
              columns_used:
                - orders.customer_rating
      
      - name: delayed_shipment_count
        business_name: Delayed Shipment Count
        description: >-
          Total number of delayed shipments. Counts shipments where actual_arrival is greater than expected_arrival.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS delayed_shipment_count
                FROM shipments
                WHERE shipments.actual_arrival > shipments.expected_arrival
              columns_used:
                - shipments.shipment_id
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: on_time_delivery_rate_pct
        business_name: On-Time Delivery Rate Percentage
        description: >-
          Percentage of shipments delivered on time or early. Calculated as (on-time shipment count / total 
          shipment count with actual arrival) * 100. Computed as (COUNT(CASE WHEN shipments.actual_arrival <= 
          shipments.expected_arrival THEN 1 END) / NULLIF(COUNT(CASE WHEN shipments.actual_arrival IS NOT NULL 
          THEN 1 END), 0)) * 100.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    (
                        COUNT(CASE WHEN shipments.actual_arrival <= shipments.expected_arrival THEN 1 END)::NUMERIC
                        / NULLIF(COUNT(CASE WHEN shipments.actual_arrival IS NOT NULL THEN 1 END), 0)
                    ) * 100 AS on_time_delivery_rate_pct
                FROM shipments
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: average_delivery_delay_days
        business_name: Average Delivery Delay Days
        description: >-
          Average delivery delay in days. Calculated as the average difference between actual_arrival and 
          expected_arrival for shipments where actual_arrival is not null. Positive values indicate delayed 
          shipments. Negative values indicate early shipments.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipments.actual_arrival - shipments.expected_arrival) AS average_delivery_delay_days
                FROM shipments
                WHERE shipments.actual_arrival IS NOT NULL
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: revenue_per_customer_usd
        business_name: Revenue Per Customer USD
        description: >-
          Average revenue per customer in USD. Calculated as total revenue divided by unique customer count. 
          Computed as SUM(orders.total_amount_usd) / NULLIF(COUNT(DISTINCT orders.customer_id), 0).
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS revenue_per_customer_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.customer_id
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer. Calculated as total order count divided by unique customer count. 
          Computed as COUNT(orders.order_id) / NULLIF(COUNT(DISTINCT orders.customer_id), 0).
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(orders.order_id)::NUMERIC / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS orders_per_customer
                FROM orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: monthly_revenue_usd
        business_name: Monthly Revenue USD
        description: >-
          Total revenue in USD aggregated by month. Groups orders by month using order_date and sums total_amount_usd. 
          Result grain is one row per month.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    SUM(orders.total_amount_usd) AS monthly_revenue_usd
                FROM orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Total order count aggregated by month. Groups orders by month using order_date and counts order_id. 
          Result grain is one row per month.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    COUNT(orders.order_id) AS monthly_order_count
                FROM orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.order_id
      
      - name: revenue_by_product
        business_name: Revenue By Product
        description: >-
          Total product line revenue in USD aggregated by product. Joins order_items to products and sums 
          line_revenue_usd. Result grain is one row per product.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    SUM(order_items.line_revenue_usd) AS revenue_by_product
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
                ORDER BY revenue_by_product DESC
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - products.product_id
                - products.product_name
      
      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue in USD aggregated by customer segment. Joins orders to customers and sums total_amount_usd. 
          Result grain is one row per customer segment.
        return_type: currency_usd
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    customers.customer_segment,
                    SUM(orders.total_amount_usd) AS revenue_by_customer_segment
                FROM orders
                INNER JOIN customers ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
                ORDER BY revenue_by_customer_segment DESC
              columns_used:
                - orders.customer_id
                - orders.total_amount_usd
                - customers.customer_id
                - customers.customer_segment
      
      - name: revenue_by_store
        business_name: Revenue By Store
        description: >-
          Total revenue in USD aggregated by store. Joins orders to stores and sums total_amount_usd. Result 
          grain is one row per store.
        return_type: currency_usd
        result_grain: one row per store
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    stores.store_id,
                    stores.store_name,
                    SUM(orders.total_amount_usd) AS revenue_by_store
                FROM orders
                INNER JOIN stores ON orders.store_id = stores.store_id
                GROUP BY stores.store_id, stores.store_name
                ORDER BY revenue_by_store DESC
              columns_used:
                - orders.store_id
                - orders.total_amount_usd
                - stores.store_id
                - stores.store_name
      
      - name: revenue_by_order_channel
        business_name: Revenue By Order Channel
        description: >-
          Total revenue in USD aggregated by order channel. Groups orders by order_channel and sums total_amount_usd. 
          Result grain is one row per order channel.
        return_type: currency_usd
        result_grain: one row per order channel
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    orders.order_channel,
                    SUM(orders.total_amount_usd) AS revenue_by_order_channel
                FROM orders
                GROUP BY orders.order_channel
                ORDER BY revenue_by_order_channel DESC
              columns_used:
                - orders.order_channel
                - orders.total_amount_usd
      
      - name: freight_cost_by_supplier
        business_name: Freight Cost By Supplier
        description: >-
          Total freight cost in USD aggregated by supplier. Joins shipments to suppliers and sums freight_cost_usd. 
          Result grain is one row per supplier.
        return_type: currency_usd
        result_grain: one row per supplier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    suppliers.supplier_id,
                    suppliers.supplier_name,
                    SUM(shipments.freight_cost_usd) AS freight_cost_by_supplier
                FROM shipments
                INNER JOIN suppliers ON shipments.supplier_id = suppliers.supplier_id
                GROUP BY suppliers.supplier_id, suppliers.supplier_name
                ORDER BY freight_cost_by_supplier DESC
              columns_used:
                - shipments.supplier_id
                - shipments.freight_cost_usd
                - suppliers.supplier_id
                - suppliers.supplier_name