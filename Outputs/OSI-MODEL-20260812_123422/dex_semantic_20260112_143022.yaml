      - name: customer_account_managers
        business_name: Customer Account Managers
        description: >-
          Customer account manager assignment data implementing SCD Type-2 for historical tracking. Contains one 
          row per customer-account manager assignment with temporal validity period. Multiple records may exist for 
          the same customer across different time periods. Use this dataset for historical account manager assignment 
          analysis.
        source: customer_account_managers
        primary_key:
          - assignment_id
        fields:
          - name: assignment_id
            business_name: Assignment Identifier
            description: Unique identifier for a customer account manager assignment.
            sql_type: SERIAL
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer record.
            sql_type: INT4
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: employee_id
            business_name: Employee ID
            description: References the related employee record acting as account manager.
            sql_type: INT4
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: valid_from
