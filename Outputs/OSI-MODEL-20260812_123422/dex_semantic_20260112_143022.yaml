      - name: employees
        business_name: Employees
        description: >-
          Employee master data containing one row per employee. Includes employee identification, employee name, 
          role, manager reference supporting recursive organizational hierarchy, region, and hire date. Use this 
          dataset for employee analysis and organizational hierarchy analysis.
        source: employees
        primary_key:
          - employee_id
        fields:
          - name: employee_id
            business_name: Employee Identifier
            description: Unique identifier for an employee.
            sql_type: SERIAL
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: employee_name
            business_name: Employee Name
            description: Full name of the employee.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
              - PII
            dimension:
              is_time: false
          
          - name: role
            business_name: Role
            description: Job role or position of the employee.
            sql_type: VARCHAR(40)
            constraints:
