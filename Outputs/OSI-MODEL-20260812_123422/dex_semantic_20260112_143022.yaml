version: "1.0"

semantic_model:
  - name: customer_experience_analytics
    description: >-
      Comprehensive semantic model for customer experience analytics covering customers, orders, products, 
      shipments, campaigns, and organizational hierarchies. This model supports revenue analysis, customer 
      segmentation, product performance, supply chain analytics, and marketing campaign effectiveness.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Guide
        
        - CUSTOMERS: One row per customer. Use for customer-level analysis.
        - ORDERS: One row per order. Use for order-level revenue and cost analysis.
        - ORDER_ITEMS: One row per order line item. Use for product-level revenue within orders.
        - PRODUCTS: One row per product. Use for product catalog analysis.
        - PRODUCT_CATEGORIES: One row per product category. Supports hierarchical category analysis.
        - STORES: One row per store. Use for store-level analysis.
        - SUPPLIERS: One row per supplier. Use for supplier performance analysis.
        - SHIPMENTS: One row per shipment. Use for shipment-level freight cost and delivery analysis.
        - SHIPMENT_ITEMS: One row per shipment line item. Use for product-level shipment quantity analysis.
        - CAMPAIGNS: One row per marketing campaign. Use for campaign-level analysis.
        - EMPLOYEES: One row per employee. Supports recursive manager hierarchy.
        - CUSTOMER_ACCOUNT_MANAGERS: One row per customer-account manager assignment with temporal validity. 
          Supports SCD Type-2 analysis for historical account manager assignments.
        - EXCHANGE_RATES: One row per currency per date. Use for as-of currency conversion.
        
        ## Metric Selection Guide
        
        ### Order-Level Revenue
        Use orders.total_amount_usd for order-level revenue analysis. This represents the complete order value.
        
        ### Product-Level Revenue
        Use order_items.line_revenue_usd for product-level or order-line-level revenue analysis. This represents 
        revenue after discount at the line item level.
        
        ### Order-Level Cost
        Use orders.total_cost_usd for order-level cost analysis.
        
        ### Product-Level Cost
        Use order_items.line_cost_usd for product-level or order-line-level cost analysis.
        
        ### Freight Cost
        Use shipments.freight_cost_usd for shipment-level freight cost analysis.
        
        ## Join Guidance
        
        ### Customer to Orders
        Join customers to orders using customer_id. This is a one-to-many relationship. One customer can have 
        multiple orders.
        
        ### Orders to Order Items
        Join orders to order_items using order_id. This is a one-to-many relationship. One order contains multiple 
        order line items.
        
        ### Order Items to Products
        Join order_items to products using product_id. This is a many-to-one relationship. Multiple order items 
        can reference the same product.
        
        ### Products to Product Categories
        Join products to product_categories using category_id. This is a many-to-one relationship. Multiple products 
        belong to the same category.
        
        ### Product Categories Hierarchy
        Join product_categories to itself using parent_category_id = category_id. This is a recursive relationship 
        supporting category hierarchies.
        
        ### Products to Suppliers
        Join products to suppliers using supplier_id. This is a many-to-one relationship. Multiple products are 
        supplied by the same supplier.
        
        ### Orders to Stores
        Join orders to stores using store_id. This is a many-to-one relationship. Multiple orders are fulfilled 
        by the same store.
        
        ### Shipments to Suppliers
        Join shipments to suppliers using supplier_id. This is a many-to-one relationship. Multiple shipments 
        originate from the same supplier.
        
        ### Shipments to Stores
        Join shipments to stores using store_id. This is a many-to-one relationship. Multiple shipments are 
        received by the same store.
        
        ### Shipments to Shipment Items
        Join shipments to shipment_items using shipment_id. This is a one-to-many relationship. One shipment 
        contains multiple shipment line items.
        
        ### Shipment Items to Products
        Join shipment_items to products using product_id. This is a many-to-one relationship. Multiple shipment 
        items reference the same product.
        
        ### Employees Hierarchy
        Join employees to itself using manager_id = employee_id. This is a recursive relationship supporting 
        organizational hierarchies. Use recursive CTEs to traverse the complete management chain.
        
        ### Customer Account Manager Assignment (SCD Type-2)
        Join orders to customer_account_managers using customer_id and temporal validity:
        - orders.customer_id = customer_account_managers.customer_id
        - orders.order_date >= customer_account_managers.valid_from
        - orders.order_date < COALESCE(customer_account_managers.valid_to, '9999-12-31'::date)
        
        This relationship supports historical account manager assignment analysis. Multiple assignment records 
        may exist for the same customer across different time periods.
        
        ### Customer Account Managers to Employees
        Join customer_account_managers to employees using employee_id. This is a many-to-one relationship. 
        Multiple customer assignments reference the same employee.
        
        ### Orders to Exchange Rates (As-Of)
        Join orders to exchange_rates using currency_code and as-of date logic:
        - orders.currency_code = exchange_rates.currency_code
        - exchange_rates.rate_date <= orders.order_date::date
        - ORDER BY exchange_rates.rate_date DESC LIMIT 1
        
        This relationship retrieves the most recent exchange rate effective on or before the order date.
        
        ## Double Counting Prevention
        
        ### Orders and Order Items
        DO NOT sum orders.total_amount_usd after joining orders to order_items. This will duplicate the order-level 
        revenue by the number of line items in each order.
        
        When analyzing at the order-item grain, use order_items.line_revenue_usd.
        When analyzing at the order grain, use orders.total_amount_usd.
        
        ### Orders and Order Items Cost
        DO NOT sum orders.total_cost_usd after joining orders to order_items. This will duplicate the order-level 
        cost by the number of line items in each order.
        
        When analyzing cost at the order-item grain, use order_items.line_cost_usd.
        When analyzing cost at the order grain, use orders.total_cost_usd.
        
        ### Shipments and Shipment Items
        DO NOT sum shipments.freight_cost_usd after joining shipments to shipment_items. This will duplicate the 
        shipment-level freight cost by the number of line items in each shipment.
        
        When analyzing freight cost, aggregate at the shipment grain using shipments.freight_cost_usd.
        When analyzing shipment quantities, use shipment_items.quantity at the shipment-item grain.
        
        ## Time Analysis
        
        ### Order Analysis
        Use orders.order_date for order-based time-series analysis. This represents when the order was placed.
        
        ### Shipment Analysis
        Use shipments.ship_date for shipment dispatch time-series analysis.
        Use shipments.expected_arrival for expected delivery time analysis.
        Use shipments.actual_arrival for actual delivery time analysis.
        
        ### Campaign Analysis
        Use campaigns.start_date and campaigns.end_date for campaign period analysis.
        
        ### Customer Signup Analysis
        Use customers.signup_date for customer acquisition time-series analysis.
        
        ### Employee Hire Analysis
        Use employees.hire_date for employee hiring time-series analysis.
        
        ## SCD Type-2 Guidance
        
        The customer_account_managers table implements SCD Type-2 for tracking historical account manager assignments.
        
        - assignment_id: Unique identifier for each assignment record
        - customer_id: Business key identifying the customer
        - employee_id: Account manager assigned
        - valid_from: Effective start date
        - valid_to: Effective end date (NULL indicates current assignment)
        
        To retrieve the account manager effective on a specific date:
        WHERE customer_id = <customer_id>
          AND <reference_date> >= valid_from
          AND <reference_date> < COALESCE(valid_to, '9999-12-31'::date)
        
        To retrieve the current account manager:
        WHERE customer_id = <customer_id>
          AND valid_to IS NULL
        
        ## As-Of Relationship Guidance
        
        The exchange_rates table supports as-of currency conversion.
        
        To retrieve the exchange rate effective on a specific date:
        WHERE currency_code = <currency_code>
          AND rate_date <= <reference_date>
        ORDER BY rate_date DESC
        LIMIT 1
        
        This retrieves the most recent exchange rate on or before the reference date.
        
        ## Recursive Hierarchy Guidance
        
        ### Employee Management Hierarchy
        The employees table contains a self-referencing relationship via manager_id.
        
        To retrieve the complete management chain for an employee, use a recursive CTE:
        
        WITH RECURSIVE management_chain AS (
          SELECT employee_id, employee_name, manager_id, 1 AS level
          FROM employees
          WHERE employee_id = <target_employee_id>
          
          UNION ALL
          
          SELECT e.employee_id, e.employee_name, e.manager_id, mc.level + 1
          FROM employees e
          INNER JOIN management_chain mc ON e.employee_id = mc.manager_id
        )
        SELECT * FROM management_chain;
        
        ### Product Category Hierarchy
        The product_categories table contains a self-referencing relationship via parent_category_id.
        
        To retrieve the complete category hierarchy, use a recursive CTE:
        
        WITH RECURSIVE category_hierarchy AS (
          SELECT category_id, category_name, parent_category_id, 1 AS level
          FROM product_categories
          WHERE parent_category_id IS NULL
          
          UNION ALL
          
          SELECT pc.category_id, pc.category_name, pc.parent_category_id, ch.level + 1
          FROM product_categories pc
          INNER JOIN category_hierarchy ch ON pc.parent_category_id = ch.category_id
        )
        SELECT * FROM category_hierarchy;
        
        ## Query Restrictions
        
        ### Currency Conversion
        Orders are placed in local currency (orders.local_amount) and converted to USD (orders.total_amount_usd).
        For historical currency conversion analysis, join to exchange_rates using as-of logic.
        
        ### Returned Orders
        Use orders.is_returned to filter or segment orders by return status.
        
        ### Campaign Effectiveness
        To analyze campaign effectiveness, join orders to campaigns using temporal logic:
        WHERE orders.order_date >= campaigns.start_date
          AND orders.order_date <= campaigns.end_date
        
        ### Delivery Performance
        Calculate delivery delay as:
        shipments.actual_arrival - shipments.expected_arrival
        
        Positive values indicate delayed shipments.
        Negative values indicate early shipments.
        NULL actual_arrival indicates shipments not yet delivered.

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master data containing one row per customer. Includes customer identification, contact 
          information, geographic location, customer segmentation, and signup date. Use this dataset for 
          customer-level analysis and customer segmentation.
        source: customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: SERIAL
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
              - PII
          
          - name: last_name
            business_name: Last Name
            description: Family name of the customer.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
              - PII
          
          - name: email
            business_name: Email
            description: Email address of the customer.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
              - PII
          
          - name: phone
            business_name: Phone
            description: Phone number of the customer.
            sql_type: VARCHAR(20)
            constraints:
              - PII
          
          - name: city
            business_name: City
            description: City of the customer's residence.
            sql_type: VARCHAR(80)
            constraints:
              - PII
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country of the customer's residence.
            sql_type: VARCHAR(80)
            constraints:
              - PII
            dimension:
              is_time: false
          
          - name: customer_segment
            business_name: Customer Segment
            description: Segment classification assigned to the customer.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: signup_date
            business_name: Signup Date
            description: Date when the customer registered or signed up.
            sql_type: DATE
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the customer record was created.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: orders
        business_name: Orders
        description: >-
          Order transaction data containing one row per customer order. Includes order identification, customer 
          reference, store reference, order date, sales channel, payment method, order status, return indicator, 
          customer rating, currency information, and order-level revenue and cost amounts. Use this dataset for 
          order-level revenue, cost, and profitability analysis.
        source: orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order.
            sql_type: SERIAL
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer ID
            description: References the related customer who placed the order.
            sql_type: INT4
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: store_id
            business_name: Store ID
            description: References the related store where the order was fulfilled.
            sql_type: INT4
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: order_date
            business_name: Order Date
            description: Timestamp when the order was placed.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_channel
            business_name: Order Channel
            description: Sales channel through which the order was placed.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: payment_method
            business_name: Payment Method
            description: Payment method selected for the order.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: order_status
            business_name: Order Status
            description: Indicates the current status of the order.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: is_returned
            business_name: Is Returned
            description: Indicates whether the order has been returned.
            sql_type: BOOL
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: customer_rating
            business_name: Customer Rating
            description: Rating provided by the customer for the order experience.
            sql_type: INT2
          
          - name: currency_code
            business_name: Currency Code
            description: Currency in which the order was placed.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: total_amount_usd
            business_name: Total Amount USD
            description: Total order amount in USD.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: local_amount
            business_name: Local Amount
            description: Total order amount in the local currency.
            sql_type: NUMERIC(14,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: total_cost_usd
            business_name: Total Cost USD
            description: Total cost associated with fulfilling the order in USD.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
              - DEFAULT
      
      - name: order_items
        business_name: Order Items
        description: >-
          Order line item data containing one row per order line item. Includes order line identification, order 
          reference, product reference, quantity, unit price, unit cost, discount percentage, and computed line-level 
          revenue and cost. Use this dataset for product-level revenue and cost analysis within orders.
        source: order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: SERIAL
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: order_id
            business_name: Order ID
            description: References the related order record.
            sql_type: INT4
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: product_id
            business_name: Product ID
            description: References the related product record.
            sql_type: INT4
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: quantity
            business_name: Quantity
            description: Number of product units in the order line item.
            sql_type: INT4
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Unit selling price of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Unit cost of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Percentage
            description: Percentage discount applied to the order line item.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: line_revenue_usd
            business_name: Line Revenue USD
            description: Revenue for the order line item in USD after discount. Computed as quantity * unit_price_usd * (1 - discount_pct / 100).
            sql_type: NUMERIC(12,2)
            constraints:
              - DEFAULT
              - COMPUTED
          
          - name: line_cost_usd
            business_name: Line Cost USD
            description: Cost for the order line item in USD. Computed as quantity * unit_cost_usd.
            sql_type: NUMERIC(12,2)
            constraints:
              - DEFAULT
              - COMPUTED
      
      - name: products
        business_name: Products
        description: >-
          Product master data containing one row per product. Includes product identification, product name, 
          category reference, unit cost, unit price, supplier reference, and creation timestamp. Use this dataset 
          for product catalog analysis and product profitability analysis.
        source: products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: SERIAL
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: product_name
            business_name: Product Name
            description: Name of the product.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: category_id
            business_name: Category ID
            description: References the related product category record.
            sql_type: INT4
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Unit cost of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Unit selling price of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: supplier_id
            business_name: Supplier ID
            description: References the related supplier providing the product.
            sql_type: INT4
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the product record was created.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master data containing one row per product category. Includes category identification, 
          category name, and parent category reference supporting hierarchical category structures. Use this dataset 
          for product category analysis and hierarchical category rollup.
        source: product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: SERIAL
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: parent_category_id
            business_name: Parent Category ID
            description: References the related parent product category record.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
      
      - name: stores
        business_name: Stores
        description: >-
          Store master data containing one row per store. Includes store identification, store name, geographic 
          location, store type, and creation timestamp. Use this dataset for store-level analysis and geographic 
          analysis.
        source: stores
        primary_key:
          - store_id
        fields:
          - name: store_id
            business_name: Store Identifier
            description: Unique identifier for a store.
            sql_type: SERIAL
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: store_name
            business_name: Store Name
            description: Name of the store.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: city
            business_name: City
            description: City where the store is located.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the store is located.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: store_type
            business_name: Store Type
            description: Type or format of the store.
            sql_type: VARCHAR(30)
            dimension:
              is_time: false
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the store record was created.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: suppliers
        business_name: Suppliers
        description: >-
          Supplier master data containing one row per supplier. Includes supplier identification, supplier name, 
          country, contact email, reliability score, and creation timestamp. Use this dataset for supplier 
          performance analysis.
        source: suppliers
        primary_key:
          - supplier_id
        fields:
          - name: supplier_id
            business_name: Supplier Identifier
            description: Unique identifier for a supplier.
            sql_type: SERIAL
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: supplier_name
            business_name: Supplier Name
            description: Name of the supplier organization.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the supplier is based.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: contact_email
            business_name: Contact Email
            description: Contact email address for the supplier.
            sql_type: VARCHAR(150)
            constraints:
              - PII
          
          - name: reliability_score
            business_name: Reliability Score
            description: Score indicating the supplier's reliability.
            sql_type: NUMERIC(3,2)
            constraints:
              - DEFAULT
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the supplier record was created.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: shipments
        business_name: Shipments
        description: >-
          Shipment transaction data containing one row per shipment. Includes shipment identification, supplier 
          reference, store reference, ship date, expected arrival, actual arrival, freight cost, and shipment status. 
          Use this dataset for shipment-level freight cost analysis and delivery performance analysis.
        source: shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: SERIAL
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: supplier_id
            business_name: Supplier ID
            description: References the related supplier responsible for the shipment.
            sql_type: INT4
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: store_id
            business_name: Store ID
            description: References the related store receiving the shipment.
            sql_type: INT4
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: ship_date
            business_name: Ship Date
            description: Timestamp when the shipment was dispatched.
            sql_type: TIMESTAMP(6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: expected_arrival
            business_name: Expected Arrival
            description: Expected arrival date of the shipment.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: actual_arrival
            business_name: Actual Arrival
            description: Actual arrival date of the shipment.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: freight_cost_usd
            business_name: Freight Cost USD
            description: Freight cost of the shipment in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: shipment_status
            business_name: Shipment Status
            description: Indicates the current status of the shipment.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
      
      - name: shipment_items
        business_name: Shipment Items
        description: >-
          Shipment line item data containing one row per shipment line item. Includes shipment line identification, 
          shipment reference, product reference, and quantity. Use this dataset for product-level shipment quantity 
          analysis.
        source: shipment_items
        primary_key:
          - shipment_item_id
        fields:
          - name: shipment_item_id
            business_name: Shipment Item Identifier
            description: Unique identifier for a shipment line item.
            sql_type: SERIAL
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: shipment_id
            business_name: Shipment ID
            description: References the related shipment record.
            sql_type: INT4
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: product_id
            business_name: Product ID
            description: References the related product included in the shipment.
            sql_type: INT4
            constraints:
              - NOT NULL
              - FOREIGN KEY
          
          - name: quantity
            business_name: Quantity
            description: Number of product units in the shipment line item.
            sql_type: INT4
            constraints:
              - NOT NULL
      
      - name: campaigns
        business_name: Campaigns
        description: >-
          Marketing campaign master data containing one row per marketing campaign. Includes campaign identification, 
          campaign name, marketing channel, target customer segment, campaign period, and discount percentage. Use 
          this dataset for campaign effectiveness analysis.
        source: campaigns
        primary_key:
          - campaign_id
        fields:
          - name: campaign_id
            business_name: Campaign Identifier
            description: Unique identifier for a marketing campaign.
            sql_type: SERIAL
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: campaign_name
            business_name: Campaign Name
            description: Name of the marketing campaign.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: channel
