              columns_used:
                - orders.store_id
                - orders.total_amount_usd
      
      - name: revenue_by_channel
        business_name: Revenue By Channel
        description: >-
          Total revenue per order channel in USD. Calculated by summing total_amount_usd from orders, grouped by order_channel.
          Result grain: One row per channel.
        return_type: currency_usd
        result_grain: one row per channel
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    orders.order_channel,
                    SUM(orders.total_amount_usd) AS revenue_by_channel_usd
                FROM orders AS orders
                GROUP BY orders.order_channel
                ORDER BY revenue_by_channel_usd DESC
              columns_used:
                - orders.order_channel
                - orders.total_amount_usd
      
      - name: employee_count
        business_name: Employee Count
        description: >-
          Total number of employees. Calculated as the count of distinct employee_id from the employees table.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT employees.employee_id) AS employee_count
                FROM employees AS employees
              columns_used:
                - employees.employee_id
      
      - name: direct_reports_count
        business_name: Direct Reports Count
        description: >-
          Number of direct reports per manager. Calculated by counting employees grouped by manager_id.
          Result grain: One row per manager.
        return_type: integer
        result_grain: one row per manager
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    employees.manager_id,
                    COUNT(employees.employee_id) AS direct_reports_count
                FROM employees AS employees
                WHERE employees.manager_id IS NOT NULL
                GROUP BY employees.manager_id
                ORDER BY direct_reports_count DESC
              columns_used:
                - employees.employee_id
                - employees.manager_id
      
      - name: campaign_count
        business_name: Campaign Count
        description: >-
          Total number of marketing campaigns. Calculated as the count of distinct campaign_id from the campaigns table.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
