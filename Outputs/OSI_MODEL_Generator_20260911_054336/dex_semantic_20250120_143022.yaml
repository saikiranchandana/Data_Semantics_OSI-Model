      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue aggregated by month. Calculated as the sum of order totals grouped by year and month 
          extracted from order timestamp. Used for monthly revenue trend analysis and time-series forecasting. 
          Returns one row per month.
        return_type: NUMERIC
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS month,
                    SUM(order_tbl.total) AS monthly_revenue
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.total
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Total number of orders aggregated by month. Calculated as the count of orders grouped by year 
          and month extracted from order timestamp. Used for monthly order volume trend analysis. 
          Returns one row per month.
        return_type: INTEGER
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS month,
                    COUNT(order_tbl.order_id) AS monthly_order_count
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.order_id
      
      - name: revenue_by_loyalty_tier
        business_name: Revenue by Customer Loyalty Tier
        description: >-
          Total revenue aggregated by customer loyalty tier. Calculated as the sum of order totals 
          grouped by customer loyalty tier. Used for tier-based revenue analysis and customer segmentation 
          performance. Returns one row per loyalty tier.
        return_type: NUMERIC
        result_grain: one row per loyalty tier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    customer.loyalty_tier,
                    SUM(order_tbl.total) AS revenue_by_loyalty_tier
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.customer AS customer
                    ON order_tbl.customer_id = customer.customer_id
                GROUP BY customer.loyalty_tier
                ORDER BY revenue_by_loyalty_tier DESC
              columns_used:
                - order_tbl.total
                - order_tbl.customer_id
                - customer.customer_id
                - customer.loyalty_tier
      
      - name: revenue_by_store
        business_name: Revenue by Store
        description: >-
          Total revenue aggregated by store location. Calculated as the sum of order totals grouped by 
          store. Used for store-level revenue performance analysis and geographic revenue distribution. 
          Returns one row per store.
        return_type: NUMERIC
        result_grain: one row per store
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    store.store_id,
                    store.name AS store_name,
                    store.city,
                    store.state,
                    SUM(order_tbl.total) AS revenue_by_store
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.store AS store
                    ON order_tbl.store_id = store.store_id
                GROUP BY store.store_id, store.name, store.city, store.state
                ORDER BY revenue_by_store DESC
              columns_used:
                - order_tbl.total
                - order_tbl.store_id
                - store.store_id
                - store.name
                - store.city
                - store.state
      
      - name: revenue_by_payment_method
        business_name: Revenue by Payment Method
        description: >-
          Total revenue aggregated by payment method. Calculated as the sum of order totals grouped by 
          payment method. Used for payment channel performance analysis and payment preference tracking. 
          Returns one row per payment method.
        return_type: NUMERIC
        result_grain: one row per payment method
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_tbl.payment_method,
                    SUM(order_tbl.total) AS revenue_by_payment_method
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY order_tbl.payment_method
                ORDER BY revenue_by_payment_method DESC
              columns_used:
                - order_tbl.payment_method
                - order_tbl.total
      
      - name: products_by_supplier
        business_name: Product Count by Supplier
        description: >-
          Total number of products aggregated by supplier. Calculated as the count of products grouped by 
          supplier. Used for supplier product portfolio analysis and supplier diversification tracking. 
          Returns one row per supplier.
        return_type: INTEGER
        result_grain: one row per supplier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    supplier.supplier_id,
                    supplier.name AS supplier_name,
                    COUNT(product.product_id) AS products_by_supplier
                FROM ecom_bronze.product AS product
                INNER JOIN ecom_bronze.supplier AS supplier
                    ON product.supplier_id = supplier.supplier_id
                GROUP BY supplier.supplier_id, supplier.name
                ORDER BY products_by_supplier DESC
              columns_used:
                - product.product_id
                - product.supplier_id
                - supplier.supplier_id
                - supplier.name
      
      - name: shipments_by_supplier
        business_name: Shipment Count by Supplier
        description: >-
          Total number of shipments aggregated by supplier. Calculated as the count of shipments grouped by 
          supplier. Used for supplier shipment volume analysis and logistics performance tracking. 
          Returns one row per supplier.
        return_type: INTEGER
        result_grain: one row per supplier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    supplier.supplier_id,
                    supplier.name AS supplier_name,
                    COUNT(shipment.shipment_id) AS shipments_by_supplier
                FROM ecom_bronze.shipment AS shipment
                INNER JOIN ecom_bronze.supplier AS supplier
                    ON shipment.supplier_id = supplier.supplier_id
                GROUP BY supplier.supplier_id, supplier.name
                ORDER BY shipments_by_supplier DESC
              columns_used:
                - shipment.shipment_id
                - shipment.supplier_id
                - supplier.supplier_id
                - supplier.name