      - name: delivered_shipment_count
        business_name: Delivered Shipment Count
        description: >-
          Total number of shipments with delivered status. Calculated as the count of shipments where 
          status equals 'Delivered'. Used for delivery completion analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(shipment.shipment_id) AS delivered_shipment_count
                FROM ecom_bronze.shipment AS shipment
                WHERE shipment.status = 'Delivered'
              columns_used:
                - shipment.shipment_id
                - shipment.status
      
      - name: average_delivery_duration
        business_name: Average Delivery Duration
        description: >-
          Average number of days between shipment dispatch and arrival. Calculated as the mean difference 
          between arrival_date and dispatch_date for delivered shipments. Used for delivery performance 
          analysis. Only includes shipments with non-null arrival dates.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipment.arrival_date - shipment.dispatch_date) AS average_delivery_duration_days
                FROM ecom_bronze.shipment AS shipment
                WHERE shipment.arrival_date IS NOT NULL
              columns_used:
                - shipment.arrival_date
                - shipment.dispatch_date
      
