version: "1.0"

semantic_model:
  - name: customer_experience_semantic_model
    description: >-
      Comprehensive semantic model for Customer Experience analytics covering customer relationships,
      sales transactions, product inventory, shipment logistics, marketing campaigns, employee management,
      and currency exchange operations. This model supports end-to-end analytical queries across customer
      lifecycle, order fulfillment, product performance, supplier reliability, and campaign effectiveness.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Guide
        
        - **customers**: One row per customer. Use for customer-level analysis.
        - **orders**: One row per order. Use for order-level revenue, cost, and profitability analysis.
        - **order_items**: One row per order line item (product within an order). Use for product-level analysis within orders.
        - **products**: One row per product. Use for product catalog and pricing analysis.
        - **product_categories**: One row per product category. Supports hierarchical category analysis via parent_category_id.
        - **stores**: One row per store location. Use for store-level performance analysis.
        - **suppliers**: One row per supplier. Use for supplier performance and reliability analysis.
        - **shipments**: One row per shipment. Use for shipment-level logistics and freight analysis.
        - **shipment_items**: One row per product within a shipment. Use for detailed shipment content analysis.
        - **campaigns**: One row per marketing campaign. Use for campaign performance analysis.
        - **employees**: One row per employee. Supports hierarchical reporting via manager_id.
        - **customer_account_managers**: One row per customer-account manager assignment with temporal validity. Supports SCD Type-2 analysis.
        - **exchange_rates**: One row per currency per date. Use for as-of currency conversion.
        
        ## Metric Selection Guide
        
        **Order-Level Revenue Metrics**:
        - Use `orders.total_amount_usd` for order-level revenue analysis.
        - Use `orders.total_cost_usd` for order-level cost analysis.
        - Do NOT sum these after joining to order_items (causes duplication).
        
        **Order-Item-Level Revenue Metrics**:
        - Use `order_items.line_revenue_usd` for product-level revenue within orders.
        - Use `order_items.line_cost_usd` for product-level cost within orders.
        - These are safe to aggregate at the order-item grain.
        
        **Shipment-Level Metrics**:
        - Use `shipments.freight_cost_usd` for shipment-level freight cost.
        - Do NOT sum after joining to shipment_items (causes duplication).
        
        **Shipment-Item-Level Metrics**:
        - Use `shipment_items.quantity` for product-level shipment quantities.
        
        ## Join Guidance
        
        **Standard Relationships**:
        - customers → orders (one-to-many via customer_id)
        - orders → order_items (one-to-many via order_id)
        - order_items → products (many-to-one via product_id)
        - products → product_categories (many-to-one via category_id)
        - products → suppliers (many-to-one via supplier_id)
        - orders → stores (many-to-one via store_id)
        - shipments → suppliers (many-to-one via supplier_id)
        - shipments → stores (many-to-one via store_id)
        - shipments → shipment_items (one-to-many via shipment_id)
        - shipment_items → products (many-to-one via product_id)
        
        **Hierarchical Relationships**:
        - product_categories.parent_category_id → product_categories.category_id (self-referencing hierarchy)
        - employees.manager_id → employees.employee_id (management hierarchy)
        
        **Temporal SCD Type-2 Relationship**:
        - orders → customer_account_managers → employees
        - Join condition: orders.customer_id = customer_account_managers.customer_id
          AND orders.order_date::date >= customer_account_managers.valid_from
          AND orders.order_date::date < COALESCE(customer_account_managers.valid_to, '9999-12-31'::date)
        - This returns the account manager assigned to the customer at the time of the order.
        
        **As-Of Currency Exchange Relationship**:
        - orders → exchange_rates
        - Join condition: orders.currency_code = exchange_rates.currency_code
          AND exchange_rates.rate_date = (
            SELECT MAX(er2.rate_date)
            FROM exchange_rates er2
            WHERE er2.currency_code = orders.currency_code
            AND er2.rate_date <= orders.order_date::date
          )
        - This returns the most recent exchange rate as of the order date.
        
        ## Double-Counting Prevention
        
        **Critical**: When joining orders to order_items:
        - Do NOT sum `orders.total_amount_usd` after the join.
        - Do NOT sum `orders.total_cost_usd` after the join.
        - Use `order_items.line_revenue_usd` and `order_items.line_cost_usd` for item-level analysis.
        
        **Critical**: When joining shipments to shipment_items:
        - Do NOT sum `shipments.freight_cost_usd` after the join.
        - Freight cost is at shipment level, not item level.
        
        **Critical**: When joining customers to orders to order_items:
        - The grain changes from customer → order → order-item.
        - Aggregations must account for the grain change.
        
        ## Time Analysis Guide
        
        **Order Analysis**:
        - Use `orders.order_date` for order placement time analysis.
        - Supports daily, monthly, quarterly, yearly aggregations.
        
        **Shipment Analysis**:
        - Use `shipments.ship_date` for shipment departure analysis.
        - Use `shipments.expected_arrival` and `shipments.actual_arrival` for delivery performance analysis.
        
        **Campaign Analysis**:
        - Use `campaigns.start_date` and `campaigns.end_date` for campaign period analysis.
        
        **Customer Analysis**:
        - Use `customers.signup_date` for customer acquisition analysis.
        - Use `customers.created_at` for record creation tracking.
        
        **Employee Analysis**:
        - Use `employees.hire_date` for employee tenure analysis.
        
        ## SCD Type-2 Guidance
        
        The `customer_account_managers` table implements SCD Type-2 for tracking customer-to-account-manager assignments over time.
        
        **Fields**:
        - `customer_id`: Business key
        - `employee_id`: Account manager assigned
        - `valid_from`: Assignment start date
        - `valid_to`: Assignment end date (NULL = current assignment)
        
        **Query Pattern**:
        To find the account manager for a customer at a specific transaction date:
        ```sql
        SELECT cam.employee_id, e.employee_name
        FROM customer_account_managers cam
        JOIN employees e ON cam.employee_id = e.employee_id
        WHERE cam.customer_id = <customer_id>
        AND <transaction_date> >= cam.valid_from
        AND <transaction_date> < COALESCE(cam.valid_to, '9999-12-31'::date)
        ```
        
        ## As-Of Exchange Rate Guidance
        
        The `exchange_rates` table provides daily exchange rates for currency conversion.
        
        **Query Pattern**:
        To convert an order amount to USD using the exchange rate as of the order date:
        ```sql
        SELECT o.order_id,
               o.local_amount,
               o.currency_code,
               er.usd_rate,
               o.local_amount * er.usd_rate AS converted_usd
        FROM orders o
        LEFT JOIN LATERAL (
          SELECT usd_rate
          FROM exchange_rates
          WHERE currency_code = o.currency_code
          AND rate_date <= o.order_date::date
          ORDER BY rate_date DESC
          LIMIT 1
        ) er ON true
        ```
        
        ## Recursive Hierarchy Guidance
        
        **Product Category Hierarchy**:
        - `product_categories.parent_category_id` references `product_categories.category_id`
        - Use recursive CTE to traverse the full category hierarchy.
        
        **Employee Management Hierarchy**:
        - `employees.manager_id` references `employees.employee_id`
        - Use recursive CTE to traverse reporting structure.
        
        **Example Recursive Query (Employee Hierarchy)**:
        ```sql
        WITH RECURSIVE employee_hierarchy AS (
          SELECT employee_id, employee_name, manager_id, 1 AS level
          FROM employees
          WHERE manager_id IS NULL
          UNION ALL
          SELECT e.employee_id, e.employee_name, e.manager_id, eh.level + 1
          FROM employees e
          JOIN employee_hierarchy eh ON e.manager_id = eh.employee_id
        )
        SELECT * FROM employee_hierarchy;
        ```
        
        ## Computed Field Formulas
        
        **order_items.line_revenue_usd**:
        - Formula: `quantity * unit_price_usd * (1 - discount_pct / 100.0)`
        - Represents revenue after discount at the order-item level.
        
        **order_items.line_cost_usd**:
        - Formula: `quantity * unit_cost_usd`
        - Represents cost at the order-item level.
        
        ## Query Restrictions and Guidance
        
        - Always specify the analytical grain when aggregating.
        - Be explicit about which date field to use for time-based analysis.
        - When joining across grain boundaries (e.g., orders → order_items), use appropriate aggregation.
        - For SCD Type-2 queries, always include temporal join conditions.
        - For as-of queries, always use the appropriate date comparison.
        - For hierarchical queries, use recursive CTEs where supported.
        - Handle NULL values appropriately in calculations (e.g., COALESCE for valid_to).
        - Use safe division (NULLIF) for ratio and percentage calculations.

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Stores comprehensive customer profiles including unique identifiers, contact details, location,
          segment classification, and signup information. Grain: One row per customer.
        source: customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: first_name
            business_name: First Name
            description: Given name of the customer.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          - name: last_name
            business_name: Last Name
            description: Family name of the customer.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          - name: email
            business_name: Email
            description: Email address used to contact the customer.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
              - UNIQUE
          - name: phone
            business_name: Phone
            description: Primary phone number of the customer.
            sql_type: VARCHAR(20)
            constraints: []
          - name: city
            business_name: City
            description: City where the customer is located.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          - name: country
            business_name: Country
            description: Country where the customer is located.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          - name: customer_segment
            business_name: Customer Segment
            description: Segment classification assigned to the customer.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: signup_date
            business_name: Signup Date
            description: Date when the customer registered or signed up.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: created_at
            business_name: Created At
            description: Timestamp when the customer record was created.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true

      - name: orders
        business_name: Orders
        description: >-
          Records end-to-end sales transactions including order identifiers, customer references, store references,
          order dates, channels, payment methods, status, return indicators, ratings, currency information, and
          monetary totals. Grain: One row per order.
        source: orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: store_id
            business_name: Store Reference
            description: References the store fulfilling the order.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: order_date
            business_name: Order Date
            description: Timestamp when the order was placed.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: order_channel
            business_name: Order Channel
            description: Channel through which the order was placed.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: payment_method
            business_name: Payment Method
            description: Method used by the customer to pay for the order.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: order_status
            business_name: Order Status
            description: Current status of the order.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: is_returned
            business_name: Is Returned
            description: Indicates whether the order has been returned.
            sql_type: BOOL
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: customer_rating
            business_name: Customer Rating
            description: Rating provided by the customer for the order experience.
            sql_type: INT2
            constraints: []
          - name: currency_code
            business_name: Currency Code
            description: Currency code used for the order amounts.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: total_amount_usd
            business_name: Total Amount USD
            description: Total order amount in USD.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
          - name: local_amount
            business_name: Local Amount
            description: Total order amount in the local currency.
            sql_type: NUMERIC(14,2)
            constraints:
              - NOT NULL
          - name: total_cost_usd
            business_name: Total Cost USD
            description: Total cost of fulfilling the order in USD.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL

      - name: order_items
        business_name: Order Items
        description: >-
          Records individual line items within orders including product references, quantities, unit prices,
          unit costs, discounts, and calculated revenue and cost values. Grain: One row per order line item
          (product within an order).
        source: order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: order_id
            business_name: Order Reference
            description: References the related order record.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: product_id
            business_name: Product Reference
            description: References the product included in the order item.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: quantity
            business_name: Quantity
            description: Number of units of the product ordered.
            sql_type: INT4
            constraints:
              - NOT NULL
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost per unit in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the order item.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
          - name: line_revenue_usd
            business_name: Line Revenue USD
            description: Calculated revenue for the order item line in USD after discounts.
            sql_type: NUMERIC(12,2)
            constraints:
              - COMPUTED
          - name: line_cost_usd
            business_name: Line Cost USD
            description: Calculated cost for the order item line in USD.
            sql_type: NUMERIC(12,2)
            constraints:
              - COMPUTED

      - name: products
        business_name: Products
        description: >-
          Contains product catalog information including product identifiers, names, category references,
          unit costs, unit prices, supplier references, and creation timestamps. Grain: One row per product.
        source: products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: product_name
            business_name: Product Name
            description: Name or title of the product.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
          - name: category_id
            business_name: Category Reference
            description: References the category to which the product belongs.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost to acquire or produce one unit of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier providing the product.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: created_at
            business_name: Created At
            description: Timestamp when the product record was created.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true

      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category definitions with hierarchical structure support via parent category references.
          Grain: One row per product category.
        source: product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          - name: parent_category_id
            business_name: Parent Category Reference
            description: References the parent category in the hierarchy.
            sql_type: INT4
            constraints:
              - FOREIGN KEY

      - name: stores
        business_name: Stores
        description: >-
          Contains store location information including store identifiers, names, city, country, store type,
          and creation timestamps. Grain: One row per store.
        source: stores
        primary_key:
          - store_id
        fields:
          - name: store_id
            business_name: Store Identifier
            description: Unique identifier for a store.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: store_name
            business_name: Store Name
            description: Name of the store.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          - name: city
            business_name: City
            description: City where the store is located.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          - name: country
            business_name: Country
            description: Country where the store is located.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          - name: store_type
            business_name: Store Type
            description: Type or format of the store, such as online or physical.
            sql_type: VARCHAR(30)
            constraints: []
            dimension:
              is_time: false
          - name: created_at
            business_name: Created At
            description: Timestamp when the store record was created.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true

      - name: suppliers
        business_name: Suppliers
        description: >-
          Contains supplier information including supplier identifiers, names, country, contact email,
          reliability scores, and creation timestamps. Grain: One row per supplier.
        source: suppliers
        primary_key:
          - supplier_id
        fields:
          - name: supplier_id
            business_name: Supplier Identifier
            description: Unique identifier for a supplier.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: supplier_name
            business_name: Supplier Name
            description: Name of the supplier organization.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          - name: country
            business_name: Country
            description: Country where the supplier is based.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          - name: contact_email
            business_name: Contact Email
            description: Email address for contacting the supplier.
            sql_type: VARCHAR(150)
            constraints: []
          - name: reliability_score
            business_name: Reliability Score
            description: Score indicating the reliability of the supplier.
            sql_type: NUMERIC(3,2)
            constraints: []
          - name: created_at
            business_name: Created At
            description: Timestamp when the supplier record was created.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true

      - name: shipments
        business_name: Shipments
        description: >-
          Contains shipment information including shipment identifiers, supplier references, store references,
          ship dates, expected and actual arrival dates, freight costs, and shipment status. Grain: One row per shipment.
        source: shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier responsible for the shipment.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: store_id
            business_name: Store Reference
            description: References the destination store for the shipment.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: ship_date
            business_name: Ship Date
            description: Timestamp when the shipment departed.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: expected_arrival
            business_name: Expected Arrival
            description: Expected arrival date of the shipment.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
          - name: actual_arrival
            business_name: Actual Arrival
            description: Actual arrival date of the shipment.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
          - name: freight_cost_usd
            business_name: Freight Cost USD
            description: Freight cost of the shipment in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          - name: shipment_status
            business_name: Shipment Status
            description: Current status of the shipment.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false

      - name: shipment_items
        business_name: Shipment Items
        description: >-
          Contains individual line items within shipments including product references and quantities.
          Grain: One row per product within a shipment.
        source: shipment_items
        primary_key:
          - shipment_item_id
        fields:
          - name: shipment_item_id
            business_name: Shipment Item Identifier
            description: Unique identifier for a shipment line item.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: shipment_id
            business_name: Shipment Reference
            description: References the shipment containing the item.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: product_id
            business_name: Product Reference
            description: References the product included in the shipment item.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: quantity
            business_name: Quantity
            description: Number of units of the product in the shipment item.
            sql_type: INT4
            constraints:
              - NOT NULL

      - name: campaigns
        business_name: Campaigns
        description: >-
          Contains marketing campaign information including campaign identifiers, names, channels, target segments,
          start and end dates, and discount percentages. Grain: One row per marketing campaign.
        source: campaigns
        primary_key:
          - campaign_id
        fields:
          - name: campaign_id
            business_name: Campaign Identifier
            description: Unique identifier for a marketing campaign.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: campaign_name
            business_name: Campaign Name
            description: Name of the marketing campaign.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          - name: channel
            business_name: Channel
            description: Marketing channel used to run the campaign.
            sql_type: VARCHAR(20)
            constraints: []
            dimension:
              is_time: false
          - name: target_segment
            business_name: Target Segment
            description: Customer segment targeted by the campaign.
            sql_type: VARCHAR(20)
            constraints: []
            dimension:
              is_time: false
          - name: start_date
            business_name: Start Date
            description: Date when the campaign starts.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: end_date
            business_name: End Date
            description: Date when the campaign ends.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount offered by the campaign.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL

      - name: employees
        business_name: Employees
        description: >-
          Contains employee information including employee identifiers, names, roles, manager references,
          regions, and hire dates. Supports hierarchical reporting structure via manager_id.
          Grain: One row per employee.
        source: employees
        primary_key:
          - employee_id
        fields:
          - name: employee_id
            business_name: Employee Identifier
            description: Unique identifier for an employee.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: employee_name
            business_name: Employee Name
            description: Full name of the employee.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          - name: role
            business_name: Role
            description: Job role or position of the employee.
            sql_type: VARCHAR(40)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: manager_id
            business_name: Manager Reference
            description: References the employee who manages this employee.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
          - name: region
            business_name: Region
            description: Geographic region assigned to the employee.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          - name: hire_date
            business_name: Hire Date
            description: Date when the employee was hired.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true

      - name: customer_account_managers
        business_name: Customer Account Managers
        description: >-
          Stores customer-to-account-manager assignments with temporal validity tracking (SCD Type-2).
          Multiple records may exist for the same customer representing different time periods.
          Grain: One row per customer-account manager assignment with validity period.
        source: customer_account_managers
        primary_key:
          - assignment_id
        fields:
          - name: assignment_id
            business_name: Assignment Identifier
            description: Unique identifier for a customer account manager assignment.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          - name: customer_id
            business_name: Customer Reference
            description: References the related customer record.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: employee_id
            business_name: Employee Reference
            description: References the employee assigned as the account manager.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          - name: valid_from
            business_name: Valid From
            description: Date when the account manager assignment becomes effective.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: valid_to
            business_name: Valid To
            description: Date when the account manager assignment ends.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true

      - name: exchange_rates
        business_name: Exchange Rates
        description: >-
          Contains daily currency exchange rates against USD for currency conversion.
          Grain: One row per currency per date.
        source: exchange_rates
        primary_key: []
        fields:
          - name: currency_code
            business_name: Currency Code
            description: ISO currency code for the exchange rate.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          - name: rate_date
            business_name: Rate Date
            description: Date for which the exchange rate applies.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          - name: usd_rate
            business_name: USD Rate
            description: Exchange rate of the currency against USD.
            sql_type: NUMERIC(12,6)
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Each order is placed by exactly one customer. Multiple orders can belong to the same customer.
          Join orders.customer_id to customers.customer_id for customer-level attributes.

      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Each order item belongs to exactly one order. An order can contain multiple order items.
          Join order_items.order_id to orders.order_id. CRITICAL: Do not sum orders.total_amount_usd
          or orders.total_cost_usd after this join to avoid double counting.

      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Each order item references exactly one product. Multiple order items can reference the same product.
          Join order_items.product_id to products.product_id for product attributes.

      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Each product belongs to exactly one category. Multiple products can belong to the same category.
          Join products.category_id to product_categories.category_id for category attributes.

      - name: products_to_suppliers
        left_dataset: products
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Each product is supplied by exactly one supplier. Multiple products can be supplied by the same supplier.
          Join products.supplier_id to suppliers.supplier_id for supplier attributes.

      - name: orders_to_stores
        left_dataset: orders
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Each order is fulfilled by exactly one store. Multiple orders can be fulfilled by the same store.
          Join orders.store_id to stores.store_id for store attributes.

      - name: shipments_to_suppliers
        left_dataset: shipments
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Each shipment originates from exactly one supplier. Multiple shipments can originate from the same supplier.
          Join shipments.supplier_id to suppliers.supplier_id for supplier attributes.

      - name: shipments_to_stores
        left_dataset: shipments
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Each shipment is destined for exactly one store. Multiple shipments can be destined for the same store.
          Join shipments.store_id to stores.store_id for store attributes.

      - name: shipment_items_to_shipments
        left_dataset: shipment_items
        right_dataset: shipments
        relationship_type: many_to_one
        join:
          left:
            - shipment_id
          right:
            - shipment_id
        join_type: many_to_one
        resolution: >-
          Each shipment item belongs to exactly one shipment. A shipment can contain multiple shipment items.
          Join shipment_items.shipment_id to shipments.shipment_id. CRITICAL: Do not sum shipments.freight_cost_usd
          after this join to avoid double counting.

      - name: shipment_items_to_products
        left_dataset: shipment_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Each shipment item references exactly one product. Multiple shipment items can reference the same product.
          Join shipment_items.product_id to products.product_id for product attributes.

      - name: customer_account_managers_to_customers
        left_dataset: customer_account_managers
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Each customer account manager assignment references exactly one customer. A customer can have multiple
          assignments over time (SCD Type-2). Join customer_account_managers.customer_id to customers.customer_id.

      - name: customer_account_managers_to_employees
        left_dataset: customer_account_managers
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - employee_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Each customer account manager assignment references exactly one employee. An employee can be assigned
          to multiple customers. Join customer_account_managers.employee_id to employees.employee_id.

      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship. Each category can have a parent category, creating a
          category hierarchy. Use recursive CTE to traverse the full hierarchy. Join
          product_categories.parent_category_id to product_categories.category_id.

      - name: employees_hierarchy
        left_dataset: employees
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - manager_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Self-referencing hierarchical relationship. Each employee can have a manager, creating an organizational
          reporting hierarchy. Use recursive CTE to traverse the full management structure. Join
          employees.manager_id to employees.employee_id.

      - name: orders_to_customer_account_managers_scd
        left_dataset: orders
        right_dataset: customer_account_managers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
            - order_date
          right:
            - customer_id
            - valid_from
            - valid_to
        join_type: scd_type2_date_range
        resolution: >-
          SCD Type-2 temporal relationship. Returns the account manager assigned to the customer at the time
          of the order. Join condition: orders.customer_id = customer_account_managers.customer_id AND
          orders.order_date::date >= customer_account_managers.valid_from AND orders.order_date::date <
          COALESCE(customer_account_managers.valid_to, '9999-12-31'::date). This ensures the correct
          historical account manager is selected based on the order date.

      - name: orders_to_exchange_rates_asof
        left_dataset: orders
        right_dataset: exchange_rates
        relationship_type: many_to_one
        join:
          left:
            - currency_code
            - order_date
          right:
            - currency_code
            - rate_date
        join_type: as_of
        resolution: >-
          As-of temporal relationship for currency conversion. Returns the most recent exchange rate as of
          the order date. Join condition: orders.currency_code = exchange_rates.currency_code AND
          exchange_rates.rate_date = (SELECT MAX(er2.rate_date) FROM exchange_rates er2 WHERE
          er2.currency_code = orders.currency_code AND er2.rate_date <= orders.order_date::date).
          This ensures the correct exchange rate is used based on the order date.

    metrics:
      - name: total_revenue_usd
        business_name: Total Revenue USD
        description: >-
          Total revenue from all orders in USD. Aggregated at the order level using orders.total_amount_usd.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) AS total_revenue_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd

      - name: total_cost_usd
        business_name: Total Cost USD
        description: >-
          Total cost of fulfilling all orders in USD. Aggregated at the order level using orders.total_cost_usd.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_cost_usd) AS total_cost_usd
                FROM orders
              columns_used:
                - orders.total_cost_usd

      - name: gross_profit_usd
        business_name: Gross Profit USD
        description: >-
          Total gross profit calculated as total revenue minus total cost in USD. Aggregated at the order level.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd) AS gross_profit_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd

      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross profit margin as a percentage of total revenue. Calculated as (total revenue - total cost) / total revenue * 100.
          Safe division handles zero revenue scenarios.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(orders.total_amount_usd) = 0 THEN 0
                        ELSE (SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd)) / NULLIF(SUM(orders.total_amount_usd), 0) * 100
                    END AS gross_margin_pct
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd

      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders placed.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(orders.order_id) AS order_count
                FROM orders
              columns_used:
                - orders.order_id

      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of unique customers.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM customers
              columns_used:
                - customers.customer_id

      - name: average_order_value_usd
        business_name: Average Order Value USD
        description: >-
          Average order value in USD calculated as total revenue divided by number of orders.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(orders.order_id), 0) AS average_order_value_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.order_id

      - name: revenue_per_customer_usd
        business_name: Revenue Per Customer USD
        description: >-
          Average revenue per customer calculated as total revenue divided by number of unique customers who placed orders.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS revenue_per_customer_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.customer_id

      - name: total_units_sold
        business_name: Total Units Sold
        description: >-
          Total number of product units sold across all order items.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.quantity) AS total_units_sold
                FROM order_items
              columns_used:
                - order_items.quantity

      - name: total_line_revenue_usd
        business_name: Total Line Revenue USD
        description: >-
          Total revenue calculated at the order item line level after discounts. Use this for product-level revenue analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_revenue_usd) AS total_line_revenue_usd
                FROM order_items
              columns_used:
                - order_items.line_revenue_usd

      - name: total_line_cost_usd
        business_name: Total Line Cost USD
        description: >-
          Total cost calculated at the order item line level. Use this for product-level cost analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_cost_usd) AS total_line_cost_usd
                FROM order_items
              columns_used:
                - order_items.line_cost_usd

      - name: average_discount_pct
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage applied across all order items weighted by revenue.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.discount_pct * order_items.quantity * order_items.unit_price_usd) / 
                    NULLIF(SUM(order_items.quantity * order_items.unit_price_usd), 0) AS average_discount_pct
                FROM order_items
              columns_used:
                - order_items.discount_pct
                - order_items.quantity
                - order_items.unit_price_usd

      - name: total_freight_cost_usd
        business_name: Total Freight Cost USD
        description: >-
          Total freight cost across all shipments in USD.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipments.freight_cost_usd) AS total_freight_cost_usd
                FROM shipments
              columns_used:
                - shipments.freight_cost_usd

      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS shipment_count
                FROM shipments
              columns_used:
                - shipments.shipment_id

      - name: total_units_shipped
        business_name: Total Units Shipped
        description: >-
          Total number of product units shipped across all shipment items.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipment_items.quantity) AS total_units_shipped
                FROM shipment_items
              columns_used:
                - shipment_items.quantity

      - name: average_customer_rating
        business_name: Average Customer Rating
        description: >-
          Average customer rating across all orders that have ratings.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(orders.customer_rating) AS average_customer_rating
                FROM orders
                WHERE orders.customer_rating IS NOT NULL
              columns_used:
                - orders.customer_rating

      - name: return_rate_pct
        business_name: Return Rate Percentage
        description: >-
          Percentage of orders that have been returned calculated as (returned orders / total orders) * 100.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    (SUM(CASE WHEN orders.is_returned = true THEN 1 ELSE 0 END)::decimal / 
                    NULLIF(COUNT(orders.order_id), 0)) * 100 AS return_rate_pct
                FROM orders
              columns_used:
                - orders.is_returned
                - orders.order_id

      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer calculated as total orders divided by unique customers who ordered.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(orders.order_id)::decimal / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS orders_per_customer
                FROM orders
              columns_used:
                - orders.order_id
                - orders.customer_id

      - name: product_count
        business_name: Product Count
        description: >-
          Total number of unique products in the catalog.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(products.product_id) AS product_count
                FROM products
              columns_used:
                - products.product_id

      - name: supplier_count
        business_name: Supplier Count
        description: >-
          Total number of unique suppliers.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(suppliers.supplier_id) AS supplier_count
                FROM suppliers
              columns_used:
                - suppliers.supplier_id

      - name: average_supplier_reliability
        business_name: Average Supplier Reliability
        description: >-
          Average reliability score across all suppliers.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(suppliers.reliability_score) AS average_supplier_reliability
                FROM suppliers
              columns_used:
                - suppliers.reliability_score

      - name: delayed_shipment_count
        business_name: Delayed Shipment Count
        description: >-
          Number of shipments where actual arrival is later than expected arrival.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS delayed_shipment_count
                FROM shipments
                WHERE shipments.actual_arrival IS NOT NULL
                AND shipments.expected_arrival IS NOT NULL
                AND shipments.actual_arrival > shipments.expected_arrival
              columns_used:
                - shipments.shipment_id
                - shipments.actual_arrival
                - shipments.expected_arrival

      - name: on_time_delivery_rate_pct
        business_name: On-Time Delivery Rate Percentage
        description: >-
          Percentage of shipments delivered on or before expected arrival date.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    (SUM(CASE WHEN shipments.actual_arrival IS NOT NULL 
                              AND shipments.expected_arrival IS NOT NULL 
                              AND shipments.actual_arrival <= shipments.expected_arrival 
                         THEN 1 ELSE 0 END)::decimal / 
                    NULLIF(SUM(CASE WHEN shipments.actual_arrival IS NOT NULL 
                                    AND shipments.expected_arrival IS NOT NULL 
                               THEN 1 ELSE 0 END), 0)) * 100 AS on_time_delivery_rate_pct
                FROM shipments
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival

      - name: average_delivery_delay_days
        business_name: Average Delivery Delay Days
        description: >-
          Average number of days shipments are delayed beyond expected arrival (only for delayed shipments).
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipments.actual_arrival - shipments.expected_arrival) AS average_delivery_delay_days
                FROM shipments
                WHERE shipments.actual_arrival IS NOT NULL
                AND shipments.expected_arrival IS NOT NULL
                AND shipments.actual_arrival > shipments.expected_arrival
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival

      - name: campaign_count
        business_name: Campaign Count
        description: >-
          Total number of marketing campaigns.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(campaigns.campaign_id) AS campaign_count
                FROM campaigns
              columns_used:
                - campaigns.campaign_id

      - name: employee_count
        business_name: Employee Count
        description: >-
          Total number of employees.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(employees.employee_id) AS employee_count
                FROM employees
              columns_used:
                - employees.employee_id

      - name: store_count
        business_name: Store Count
        description: >-
          Total number of stores.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(stores.store_id) AS store_count
                FROM stores
              columns_used:
                - stores.store_id

      - name: revenue_by_month
        business_name: Revenue By Month
        description: >-
          Monthly revenue aggregated by order date month. Returns one row per month with total revenue.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    SUM(orders.total_amount_usd) AS revenue_by_month
                FROM orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd

      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue aggregated by customer segment. Returns one row per segment.
        return_type: currency_usd
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    customers.customer_segment,
                    SUM(orders.total_amount_usd) AS revenue_by_customer_segment
                FROM orders
                JOIN customers ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
                ORDER BY revenue_by_customer_segment DESC
              columns_used:
                - orders.total_amount_usd
                - orders.customer_id
                - customers.customer_id
                - customers.customer_segment

      - name: revenue_by_product
        business_name: Revenue By Product
        description: >-
          Total line revenue aggregated by product. Returns one row per product.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    SUM(order_items.line_revenue_usd) AS revenue_by_product
                FROM order_items
                JOIN products ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
                ORDER BY revenue_by_product DESC
              columns_used:
                - order_items.line_revenue_usd
                - order_items.product_id
                - products.product_id
                - products.product_name

      - name: revenue_by_store
        business_name: Revenue By Store
        description: >-
          Total revenue aggregated by store. Returns one row per store.
        return_type: currency_usd
        result_grain: one row per store
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    stores.store_id,
                    stores.store_name,
                    SUM(orders.total_amount_usd) AS revenue_by_store
                FROM orders
                JOIN stores ON orders.store_id = stores.store_id
                GROUP BY stores.store_id, stores.store_name
                ORDER BY revenue_by_store DESC
              columns_used:
                - orders.total_amount_usd
                - orders.store_id
                - stores.store_id
                - stores.store_name

      - name: revenue_by_channel
        business_name: Revenue By Channel
        description: >-
          Total revenue aggregated by order channel. Returns one row per channel.
        return_type: currency_usd
        result_grain: one row per channel
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    orders.order_channel,
                    SUM(orders.total_amount_usd) AS revenue_by_channel
                FROM orders
                GROUP BY orders.order_channel
                ORDER BY revenue_by_channel DESC
              columns_used:
                - orders.order_channel
                - orders.total_amount_usd

      - name: top_customers_by_revenue
        business_name: Top Customers By Revenue
        description: >-
          Customers ranked by total revenue with revenue rank. Returns one row per customer.
        return_type: currency_usd
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    customers.customer_id,
                    customers.first_name,
                    customers.last_name,
                    SUM(orders.total_amount_usd) AS customer_revenue,
                    RANK() OVER (ORDER BY SUM(orders.total_amount_usd) DESC) AS revenue_rank
                FROM orders
                JOIN customers ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_id, customers.first_name, customers.last_name
                ORDER BY customer_revenue DESC
              columns_used:
                - orders.total_amount_usd
                - orders.customer_id
                - customers.customer_id
                - customers.first_name
                - customers.last_name

      - name: running_revenue_total
        business_name: Running Revenue Total
        description: >-
          Cumulative running total of revenue ordered by order date. Returns one row per order with running total.
        return_type: currency_usd
        result_grain: one row per order
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    orders.order_id,
                    orders.order_date,
                    orders.total_amount_usd,
                    SUM(orders.total_amount_usd) OVER (ORDER BY orders.order_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_revenue_total
                FROM orders
                ORDER BY orders.order_date
              columns_used:
                - orders.order_id
                - orders.order_date
                - orders.total_amount_usd