      - name: average_shipment_transit_days
        business_name: Average Shipment Transit Days
        description: >-
          Average number of days between dispatch and arrival for shipments. 
          Calculated as arrival_date minus dispatch_date.
        return_type: numeric
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipment.arrival_date - shipment.dispatch_date) AS average_shipment_transit_days
                FROM ecom_bronze.shipment AS shipment
                WHERE shipment.arrival_date IS NOT NULL
                  AND shipment.dispatch_date IS NOT NULL
              columns_used:
                - shipment.arrival_date
                - shipment.dispatch_date