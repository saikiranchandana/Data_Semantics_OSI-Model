      - name: month_over_month_revenue_growth_pct
        business_name: Month-Over-Month Revenue Growth Percentage
        description: >-
          Month-over-month revenue growth percentage. Calculated as the percentage change in revenue
          compared to the previous month using LAG window function. One row per month.
        return_type: percentage
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                WITH monthly_revenue AS (
                  SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    SUM(orders.total_amount_usd) AS revenue_usd
                  FROM semantic.orders AS orders
                  GROUP BY DATE_TRUNC('month', orders.order_date)
                )
                SELECT
                  order_month,
                  revenue_usd,
                  LAG(revenue_usd) OVER (ORDER BY order_month) AS prev_month_revenue_usd,
                  CASE
                    WHEN LAG(revenue_usd) OVER (ORDER BY order_month) = 0 THEN NULL
                    ELSE
                      (revenue_usd - LAG(revenue_usd) OVER (ORDER BY order_month)) * 100.0
                      / NULLIF(LAG(revenue_usd) OVER (ORDER BY order_month), 0)
                  END AS mom_growth_pct
                FROM monthly_revenue
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd

      - name: running_total_revenue_usd
        business_name: Running Total Revenue USD
        description: >-
          Running total revenue in USD over time. Calculated as the cumulative sum of monthly revenue
          using window function. One row per month.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                WITH monthly_revenue AS (
                  SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    SUM(orders.total_amount_usd) AS revenue_usd
                  FROM semantic.orders AS orders
                  GROUP BY DATE_TRUNC('month', orders.order_date)
                )
                SELECT
                  order_month,
                  revenue_usd,
                  SUM(revenue_usd) OVER (ORDER BY order_month ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total_revenue_usd
                FROM monthly_revenue
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd

      - name: product_revenue_rank
        business_name: Product Revenue Rank
        description: >-
          Revenue rank by product. Products are ranked by total revenue in descending order using
          DENSE_RANK window function. One row per product.
        return_type: integer
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                WITH product_revenue AS (
                  SELECT
                    products.product_id,
                    products.product_name,
                    SUM(order_items.line_revenue_usd) AS revenue_usd
                  FROM semantic.order_items AS order_items
                  INNER JOIN semantic.products AS products
                    ON order_items.product_id = products.product_id
                  GROUP BY products.product_id, products.product_name
                )
                SELECT
                  product_id,
                  product_name,
                  revenue_usd,
                  DENSE_RANK() OVER (ORDER BY revenue_usd DESC) AS revenue_rank
                FROM product_revenue
                ORDER BY revenue_rank
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - products.product_id
                - products.product_name

      - name: customer_revenue_rank
        business_name: Customer Revenue Rank
        description: >-
          Revenue rank by customer. Customers are ranked by total revenue in descending order using
          DENSE_RANK window function. One row per customer.
        return_type: integer
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                WITH customer_revenue AS (
                  SELECT
                    customers.customer_id,
                    customers.first_name,
                    customers.last_name,
                    SUM(orders.total_amount_usd) AS revenue_usd
                  FROM semantic.orders AS orders
                  INNER JOIN semantic.customers AS customers
                    ON orders.customer_id = customers.customer_id
                  GROUP BY customers.customer_id, customers.first_name, customers.last_name
                )
                SELECT
                  customer_id,
                  first_name,
                  last_name,
                  revenue_usd,
                  DENSE_RANK() OVER (ORDER BY revenue_usd DESC) AS revenue_rank
                FROM customer_revenue
                ORDER BY revenue_rank
              columns_used:
                - orders.customer_id
                - orders.total_amount_usd
                - customers.customer_id
                - customers.first_name
                - customers.last_name

      - name: average_supplier_reliability_score
        business_name: Average Supplier Reliability Score
