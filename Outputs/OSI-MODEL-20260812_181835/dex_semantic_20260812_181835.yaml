        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(suppliers.reliability_score) AS average_reliability_score
                FROM semantic.suppliers AS suppliers
                WHERE suppliers.reliability_score IS NOT NULL
              columns_used:
