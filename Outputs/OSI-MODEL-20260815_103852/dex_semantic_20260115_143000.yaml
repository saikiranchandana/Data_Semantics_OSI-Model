      - name: average_product_price
        business_name: Average Product Price
        description: >-
          Average unit price across all products.
          Calculated as the mean of product.price.
          Result represents average product pricing in USD.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
