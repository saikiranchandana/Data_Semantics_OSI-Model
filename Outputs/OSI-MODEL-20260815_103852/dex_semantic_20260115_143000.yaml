      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue aggregated by month.
          Extracts year and month from order timestamp and sums order totals.
          Result shows revenue time-series at monthly grain.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    SUM(order_tbl.total) AS monthly_revenue
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.total
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Count of orders aggregated by month.
          Extracts year and month from order timestamp and counts order_id.
          Result shows order volume time-series at monthly grain.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    COUNT(order_tbl.order_id) AS monthly_order_count
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.order_id
      
      - name: customer_acquisition_by_month
        business_name: Customer Acquisition by Month
        description: >-
          Count of new customers acquired each month.
          Extracts year and month from customer join_date and counts customer_id.
          Result shows customer acquisition time-series at monthly grain.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', customer.join_date) AS join_month,
                    COUNT(customer.customer_id) AS new_customers
                FROM ecom_bronze.customer AS customer
                GROUP BY DATE_TRUNC('month', customer.join_date)
                ORDER BY join_month
              columns_used:
                - customer.join_date
                - customer.customer_id
      
      - name: revenue_by_store_and_month
        business_name: Revenue by Store and Month
        description: >-
          Total revenue segmented by store and month.
          Joins orders to stores, extracts month from order timestamp, and aggregates revenue.
          Result shows revenue time-series at store-month grain for store performance tracking.
        return_type: currency_usd
        result_grain: one row per store per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    store.store_id,
                    store.name AS store_name,
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    SUM(order_tbl.total) AS revenue
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.store AS store
                    ON order_tbl.store_id = store.store_id
                GROUP BY store.store_id, store.name, DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY store.store_id, order_month
              columns_used:
                - order_tbl.total
                - order_tbl.timestamp
                - order_tbl.store_id
                - store.store_id
                - store.name