version: "1.0"

semantic_model:
  - name: ecommerce_retail_analytics
    description: >-
      Comprehensive semantic model for e-commerce retail analytics covering customers, orders, products, 
      shipments, stores, and suppliers. This model supports analytical queries across customer behavior, 
      order fulfillment, product performance, supply chain operations, and store performance.
    
    ai_context:
      instructions: >-
        This semantic model represents an e-commerce retail business with six core datasets:
        
        DATASET GRAIN:
        - customers: One row per customer (grain: customer_id)
        - order_tbl: One row per order (grain: order_id)
        - product: One row per product (grain: product_id)
        - shipment: One row per shipment (grain: shipment_id)
        - store: One row per store location (grain: store_id)
        - supplier: One row per supplier (grain: supplier_id)
        
        RELATIONSHIP STRUCTURE:
        - Customers place Orders (customers 1 → * order_tbl via customer_id)
        - Orders are fulfilled at Stores (order_tbl * → 1 store via store_id)
        - Products are supplied by Suppliers (product * → 1 supplier via supplier_id)
        - Shipments come from Suppliers (shipment * → 1 supplier via supplier_id)
        - Shipments are delivered to Stores (shipment * → 1 store via store_id)
        
        METRIC GUIDANCE:
        - For order-level revenue analysis, use order_tbl.total
        - For customer spending analysis, use customer.total_spend (cumulative) or aggregate order_tbl.total by customer
        - For product pricing analysis, use product.price
        - For shipment weight analysis, use shipment.weight
        - For supplier performance, use supplier.rating
        
        JOIN GUIDANCE:
        - To analyze orders by customer: JOIN order_tbl to customers via customer_id
        - To analyze orders by store: JOIN order_tbl to store via store_id
        - To analyze products by supplier: JOIN product to supplier via supplier_id
        - To analyze shipments by supplier: JOIN shipment to supplier via supplier_id
        - To analyze shipments by store: JOIN shipment to store via store_id
        
        DOUBLE COUNTING PREVENTION:
        - order_tbl.total is an order-level measure. Do not sum after joining to other datasets without proper aggregation.
        - customer.total_spend is a cumulative customer-level measure. Do not sum after joining to order_tbl.
        - When analyzing orders and customers together, aggregate order_tbl.total by customer to avoid duplication.
        
        TIME ANALYSIS:
        - For order analysis over time, use order_tbl.timestamp
        - For customer enrollment analysis, use customer.join_date
        - For store opening analysis, use store.open_date
        - For shipment dispatch analysis, use shipment.dispatch_date
        - For shipment arrival analysis, use shipment.arrival_date
        
        CATEGORICAL DIMENSIONS:
        - Customer segmentation: customer.loyalty_tier (Gold, Silver, Bronze, etc.)
        - Order status: order_tbl.status (Completed, Pending, Cancelled, etc.)
        - Payment method: order_tbl.payment_method (Credit Card, Debit Card, PayPal, etc.)
        - Product category: product.category (Beverages, Food, etc.)
        - Product origin: product.origin (country/region)
        - Shipment status: shipment.status (In Transit, Delivered, etc.)
        - Store location: store.city, store.state
        - Supplier country: supplier.country
        - Supplier certification: supplier.certification (Fair Trade, Organic, etc.)
        
        QUERY RESTRICTIONS:
        - customer.name and customer.email are PII fields and should be handled according to privacy policies
        - order_tbl.payment_method is PII and should be aggregated or anonymized in reports
        - customer.total_spend represents cumulative historical spend and may not match sum of current orders
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains customer master data including customer identifiers, personal information, 
          loyalty tier classification, enrollment date, and cumulative spending. 
          Grain: One row per customer.
        source: ecom_bronze.customer
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: >-
              Unique identifier for a customer. Primary key for the customer dataset.
            sql_type: VARCHAR(50)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: name
            business_name: Customer Name
            description: >-
              Full name of the customer. This field contains personally identifiable information (PII).
            sql_type: VARCHAR(200)
            constraints:
              - NOT NULL
              - PII
          
          - name: email
            business_name: Email Address
            description: >-
              Email address used to contact the customer. This field contains personally identifiable information (PII).
            sql_type: VARCHAR(255)
            constraints:
              - PII
          
          - name: loyalty_tier
            business_name: Loyalty Tier
            description: >-
              Indicates the loyalty tier level assigned to the customer (e.g., Gold, Silver, Bronze). 
              Used for customer segmentation and targeted marketing.
            sql_type: ecom_bronze.loyalty_tier_enum
            dimension:
              is_categorical: true
          
          - name: join_date
            business_name: Join Date
            description: >-
              Date when the customer enrolled or first registered with the platform.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: total_spend
            business_name: Total Spend
            description: >-
              Cumulative monetary amount the customer has spent across all orders. 
              This is a derived cumulative measure and may not match the sum of current order totals.
            sql_type: NUMERIC(12,2)
            constraints:
              - DEFAULT 0
      
      - name: order_tbl
        business_name: Orders
        description: >-
          Contains order transaction data including order identifiers, timestamps, order totals, 
          status, payment method, and references to customers and stores. 
          Grain: One row per order.
        source: ecom_bronze.order_tbl
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: >-
              Unique identifier for a customer order. Primary key for the order dataset.
            sql_type: VARCHAR(50)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: timestamp
            business_name: Order Timestamp
            description: >-
              Timestamp recording when the order was placed. Used for time-series analysis of order activity.
            sql_type: TIMESTAMP(29,6)
            dimension:
              is_time: true
          
          - name: total
            business_name: Order Total
            description: >-
              Monetary amount representing the total value of the order. 
              This is an order-level measure and should not be summed after joining to order items or other detail datasets.
            sql_type: NUMERIC(10,2)
          
          - name: status
            business_name: Order Status
            description: >-
              Indicates the current status of the order (e.g., Completed, Pending, Cancelled, Processing).
            sql_type: ecom_bronze.order_status_enum
            dimension:
              is_categorical: true
          
          - name: payment_method
            business_name: Payment Method
            description: >-
              Indicates the payment method used for the order (e.g., Credit Card, Debit Card, PayPal). 
              This field contains personally identifiable information (PII).
            sql_type: ecom_bronze.payment_method_enum
            constraints:
              - PII
            dimension:
              is_categorical: true
          
          - name: customer_id
            business_name: Customer Reference
            description: >-
              References the related customer record associated with the order. 
              Foreign key to customers.customer_id.
            sql_type: VARCHAR(50)
            constraints:
              - FOREIGN KEY
          
          - name: store_id
            business_name: Store Reference
            description: >-
              References the store where the order was fulfilled. 
              Foreign key to store.store_id.
            sql_type: VARCHAR(50)
            constraints:
              - FOREIGN KEY
      
      - name: product
        business_name: Products
        description: >-
          Contains product master data including product identifiers, names, categories, pricing, 
          origin information, organic certification status, and supplier references. 
          Grain: One row per product.
        source: ecom_bronze.product
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: >-
              Unique identifier for a product. Primary key for the product dataset.
            sql_type: VARCHAR(50)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: name
            business_name: Product Name
            description: >-
              Name of the product as presented to customers.
            sql_type: VARCHAR(200)
            constraints:
              - NOT NULL
          
          - name: category
            business_name: Product Category
            description: >-
              Category grouping used to classify the product (e.g., Beverages, Food, Electronics).
            sql_type: ecom_bronze.product_category_enum
            dimension:
              is_categorical: true
          
          - name: price
            business_name: Product Price
            description: >-
              Monetary price at which the product is sold. Used for pricing analysis and revenue calculations.
            sql_type: NUMERIC(10,2)
          
          - name: origin
            business_name: Product Origin
            description: >-
              Country or region where the product originates. Used for geographic product analysis.
            sql_type: VARCHAR(100)
            dimension:
              is_categorical: true
          
          - name: is_organic
            business_name: Is Organic
            description: >-
              Indicates whether the product is certified organic (true/false).
            sql_type: BOOL
            constraints:
              - DEFAULT true
            dimension:
              is_categorical: true
          
          - name: supplier_id
            business_name: Supplier Reference
            description: >-
              References the supplier that provides the product. 
              Foreign key to supplier.supplier_id.
            sql_type: VARCHAR(50)
            constraints:
              - FOREIGN KEY
      
      - name: shipment
        business_name: Shipments
        description: >-
          Contains shipment tracking data including shipment identifiers, dispatch and arrival dates, 
          status, weight, and references to suppliers and stores. 
          Grain: One row per shipment.
        source: ecom_bronze.shipment
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: >-
              Unique identifier for a shipment. Primary key for the shipment dataset.
            sql_type: VARCHAR(50)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: dispatch_date
            business_name: Dispatch Date
            description: >-
              Date when the shipment was dispatched from the origin location. 
              Used for shipment timing and logistics analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: arrival_date
            business_name: Arrival Date
            description: >-
              Date when the shipment arrived at the destination. 
              Used for delivery performance and logistics analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: status
            business_name: Shipment Status
            description: >-
              Indicates the current status of the shipment (e.g., In Transit, Delivered, Delayed).
            sql_type: ecom_bronze.shipment_status_enum
            dimension:
              is_categorical: true
          
          - name: weight
            business_name: Shipment Weight
            description: >-
              Total weight of the shipment in kilograms. Used for logistics and capacity analysis.
            sql_type: NUMERIC(10,2)
          
          - name: supplier_id
            business_name: Supplier Reference
            description: >-
              References the supplier responsible for the shipment. 
              Foreign key to supplier.supplier_id.
            sql_type: VARCHAR(50)
            constraints:
              - FOREIGN KEY
          
          - name: store_id
            business_name: Store Reference
            description: >-
              References the store receiving the shipment. 
              Foreign key to store.store_id.
            sql_type: VARCHAR(50)
            constraints:
              - FOREIGN KEY
      
      - name: store
        business_name: Stores
        description: >-
          Contains store location master data including store identifiers, names, geographic location, 
          opening date, and operational capacity. 
          Grain: One row per store location.
        source: ecom_bronze.store
        primary_key:
          - store_id
        fields:
          - name: store_id
            business_name: Store Identifier
            description: >-
              Unique identifier for a store location. Primary key for the store dataset.
            sql_type: VARCHAR(50)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: name
            business_name: Store Name
            description: >-
              Name of the store location.
            sql_type: VARCHAR(200)
            constraints:
              - NOT NULL
          
          - name: city
            business_name: City
            description: >-
              City where the store is located. Used for geographic store analysis.
            sql_type: VARCHAR(100)
            dimension:
              is_categorical: true
          
          - name: state
            business_name: State
            description: >-
              State or region where the store is located. Used for geographic store analysis.
            sql_type: VARCHAR(100)
            dimension:
              is_categorical: true
          
          - name: open_date
            business_name: Store Open Date
            description: >-
              Date when the store began operations. Used for store lifecycle and performance analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: capacity
            business_name: Store Capacity
            description: >-
              Indicates the operational or customer capacity of the store. 
              Used for capacity planning and utilization analysis.
            sql_type: INT4
      
      - name: supplier
        business_name: Suppliers
        description: >-
          Contains supplier master data including supplier identifiers, names, country of origin, 
          certification status, and performance ratings. 
          Grain: One row per supplier.
        source: ecom_bronze.supplier
        primary_key:
          - supplier_id
        fields:
          - name: supplier_id
            business_name: Supplier Identifier
            description: >-
              Unique identifier for a supplier. Primary key for the supplier dataset.
            sql_type: VARCHAR(50)
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - UNIQUE
          
          - name: name
            business_name: Supplier Name
            description: >-
              Name of the supplier organization.
            sql_type: VARCHAR(200)
            constraints:
              - NOT NULL
          
          - name: country
            business_name: Supplier Country
            description: >-
              Country where the supplier is based. Used for geographic supplier analysis.
            sql_type: VARCHAR(100)
            dimension:
              is_categorical: true
          
          - name: certification
            business_name: Supplier Certification
            description: >-
              Indicates the certification status or type held by the supplier (e.g., Fair Trade, Organic, ISO).
            sql_type: ecom_bronze.certification_enum
            dimension:
              is_categorical: true
          
          - name: rating
            business_name: Supplier Rating
            description: >-
              Numeric rating representing the supplier's performance or quality (scale 0.0 to 5.0).
            sql_type: NUMERIC(2,1)
    
    relationships:
      - name: orders_to_customers
        left_dataset: order_tbl
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Each order is placed by exactly one customer. Multiple orders can be placed by the same customer.
          Join order_tbl to customers using customer_id to analyze orders by customer attributes such as 
          loyalty tier, join date, or cumulative spend.
      
      - name: orders_to_stores
        left_dataset: order_tbl
        right_dataset: store
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Each order is fulfilled at exactly one store location. Multiple orders can be fulfilled at the same store.
          Join order_tbl to store using store_id to analyze orders by store location, city, state, or capacity.
      
      - name: products_to_suppliers
        left_dataset: product
        right_dataset: supplier
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Each product is supplied by exactly one supplier. Multiple products can be supplied by the same supplier.
          Join product to supplier using supplier_id to analyze products by supplier attributes such as 
          country, certification, or rating.
      
      - name: shipments_to_suppliers
        left_dataset: shipment
        right_dataset: supplier
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Each shipment originates from exactly one supplier. Multiple shipments can come from the same supplier.
          Join shipment to supplier using supplier_id to analyze shipments by supplier attributes such as 
          country, certification, or rating.
      
      - name: shipments_to_stores
        left_dataset: shipment
        right_dataset: store
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Each shipment is delivered to exactly one store location. Multiple shipments can be delivered to the same store.
          Join shipment to store using store_id to analyze shipments by store location, city, state, or capacity.
    
    metrics:
      - name: total_order_revenue
        business_name: Total Order Revenue
        description: >-
          Sum of all order totals across all orders. Represents the total revenue generated from orders.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_tbl.total) AS total_order_revenue
                FROM ecom_bronze.order_tbl AS order_tbl
              columns_used:
                - order_tbl.total
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders placed. Used for order volume analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(order_tbl.order_id) AS order_count
                FROM ecom_bronze.order_tbl AS order_tbl
              columns_used:
                - order_tbl.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of unique customers in the system.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(customers.customer_id) AS customer_count
                FROM ecom_bronze.customer AS customers
              columns_used:
                - customers.customer_id
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average monetary value per order. Calculated as total order revenue divided by order count.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(order_tbl.order_id) = 0 THEN 0
                        ELSE SUM(order_tbl.total) / COUNT(order_tbl.order_id)
                    END AS average_order_value
                FROM ecom_bronze.order_tbl AS order_tbl
              columns_used:
                - order_tbl.total
                - order_tbl.order_id
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders placed per customer. Calculated as total order count divided by customer count.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                        ELSE COUNT(order_tbl.order_id)::NUMERIC / COUNT(DISTINCT customers.customer_id)
                    END AS orders_per_customer
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.customer AS customers
                    ON order_tbl.customer_id = customers.customer_id
              columns_used:
                - order_tbl.order_id
                - order_tbl.customer_id
                - customers.customer_id
      
      - name: revenue_per_customer
        business_name: Revenue Per Customer
        description: >-
          Average revenue generated per customer. Calculated as total order revenue divided by unique customer count.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT customers.customer_id) = 0 THEN 0
                        ELSE SUM(order_tbl.total) / COUNT(DISTINCT customers.customer_id)
                    END AS revenue_per_customer
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.customer AS customers
                    ON order_tbl.customer_id = customers.customer_id
              columns_used:
                - order_tbl.total
                - order_tbl.customer_id
                - customers.customer_id
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of unique products in the catalog.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(product.product_id) AS product_count
                FROM ecom_bronze.product AS product
              columns_used:
                - product.product_id
      
      - name: average_product_price
        business_name: Average Product Price
        description: >-
          Average price across all products in the catalog.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(product.price) AS average_product_price
                FROM ecom_bronze.product AS product
              columns_used:
                - product.price
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments tracked in the system.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(shipment.shipment_id) AS shipment_count
                FROM ecom_bronze.shipment AS shipment
              columns_used:
                - shipment.shipment_id
      
      - name: total_shipment_weight
        business_name: Total Shipment Weight
        description: >-
          Sum of all shipment weights. Used for logistics capacity and volume analysis.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipment.weight) AS total_shipment_weight
                FROM ecom_bronze.shipment AS shipment
              columns_used:
                - shipment.weight
      
      - name: average_shipment_weight
        business_name: Average Shipment Weight
        description: >-
          Average weight per shipment. Used for logistics planning and capacity analysis.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipment.weight) AS average_shipment_weight
                FROM ecom_bronze.shipment AS shipment
              columns_used:
                - shipment.weight
      
      - name: average_delivery_days
        business_name: Average Delivery Days
        description: >-
          Average number of days between shipment dispatch and arrival. 
          Used for delivery performance analysis.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipment.arrival_date - shipment.dispatch_date) AS average_delivery_days
                FROM ecom_bronze.shipment AS shipment
                WHERE shipment.arrival_date IS NOT NULL
                    AND shipment.dispatch_date IS NOT NULL
              columns_used:
                - shipment.arrival_date
                - shipment.dispatch_date
      
      - name: store_count
        business_name: Store Count
        description: >-
          Total number of store locations in the network.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(store.store_id) AS store_count
                FROM ecom_bronze.store AS store
              columns_used:
                - store.store_id
      
      - name: total_store_capacity
        business_name: Total Store Capacity
        description: >-
          Sum of capacity across all store locations. Used for network capacity analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(store.capacity) AS total_store_capacity
                FROM ecom_bronze.store AS store
              columns_used:
                - store.capacity
      
      - name: average_store_capacity
        business_name: Average Store Capacity
        description: >-
          Average capacity per store location. Used for capacity planning and benchmarking.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(store.capacity) AS average_store_capacity
                FROM ecom_bronze.store AS store
              columns_used:
                - store.capacity
      
      - name: supplier_count
        business_name: Supplier Count
        description: >-
          Total number of suppliers in the supply chain network.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(supplier.supplier_id) AS supplier_count
                FROM ecom_bronze.supplier AS supplier
              columns_used:
                - supplier.supplier_id
      
      - name: average_supplier_rating
        business_name: Average Supplier Rating
        description: >-
          Average rating across all suppliers. Used for supplier performance benchmarking.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(supplier.rating) AS average_supplier_rating
                FROM ecom_bronze.supplier AS supplier
              columns_used:
                - supplier.rating
      
      - name: completed_order_count
        business_name: Completed Order Count
        description: >-
          Total number of orders with status 'Completed'. Used for fulfillment performance analysis.
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(order_tbl.order_id) AS completed_order_count
                FROM ecom_bronze.order_tbl AS order_tbl
                WHERE order_tbl.status = 'Completed'
              columns_used:
                - order_tbl.order_id
                - order_tbl.status
      
      - name: completed_order_revenue
        business_name: Completed Order Revenue
        description: >-
          Total revenue from orders with status 'Completed'. 
          Represents confirmed revenue from successfully fulfilled orders.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_tbl.total) AS completed_order_revenue
                FROM ecom_bronze.order_tbl AS order_tbl
                WHERE order_tbl.status = 'Completed'
              columns_used:
                - order_tbl.total
                - order_tbl.status
      
      - name: order_completion_rate
        business_name: Order Completion Rate
        description: >-
          Percentage of orders with status 'Completed' out of total orders. 
          Used for order fulfillment performance analysis.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(order_tbl.order_id) = 0 THEN 0
                        ELSE (COUNT(CASE WHEN order_tbl.status = 'Completed' THEN 1 END)::NUMERIC 
                              / COUNT(order_tbl.order_id)) * 100
                    END AS order_completion_rate
                FROM ecom_bronze.order_tbl AS order_tbl
              columns_used:
                - order_tbl.order_id
                - order_tbl.status
      
      - name: organic_product_count
        business_name: Organic Product Count
        description: >-
          Total number of products certified as organic (is_organic = true).
        return_type: INTEGER
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(product.product_id) AS organic_product_count
                FROM ecom_bronze.product AS product
                WHERE product.is_organic = true
              columns_used:
                - product.product_id
                - product.is_organic
      
      - name: organic_product_percentage
        business_name: Organic Product Percentage
        description: >-
          Percentage of products that are certified organic out of total products.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(product.product_id) = 0 THEN 0
                        ELSE (COUNT(CASE WHEN product.is_organic = true THEN 1 END)::NUMERIC 
                              / COUNT(product.product_id)) * 100
                    END AS organic_product_percentage
                FROM ecom_bronze.product AS product
              columns_used:
                - product.product_id
                - product.is_organic
      
      - name: revenue_by_loyalty_tier
        business_name: Revenue By Loyalty Tier
        description: >-
          Total order revenue grouped by customer loyalty tier. 
          Used for customer segmentation and loyalty program analysis.
        return_type: NUMERIC
        result_grain: one row per loyalty tier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    customers.loyalty_tier,
                    SUM(order_tbl.total) AS revenue_by_loyalty_tier
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.customer AS customers
                    ON order_tbl.customer_id = customers.customer_id
                GROUP BY customers.loyalty_tier
              columns_used:
                - order_tbl.total
                - order_tbl.customer_id
                - customers.customer_id
                - customers.loyalty_tier
      
      - name: revenue_by_store
        business_name: Revenue By Store
        description: >-
          Total order revenue grouped by store location. 
          Used for store performance analysis and comparison.
        return_type: NUMERIC
        result_grain: one row per store
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    store.store_id,
                    store.name AS store_name,
                    SUM(order_tbl.total) AS revenue_by_store
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.store AS store
                    ON order_tbl.store_id = store.store_id
                GROUP BY store.store_id, store.name
              columns_used:
                - order_tbl.total
                - order_tbl.store_id
                - store.store_id
                - store.name
      
      - name: revenue_by_product_category
        business_name: Revenue By Product Category
        description: >-
          Total revenue grouped by product category. 
          Requires joining orders to order items to products (note: order items table not available in current glossary).
        return_type: NUMERIC
        result_grain: one row per product category
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    product.category,
                    COUNT(DISTINCT product.product_id) AS product_count
                FROM ecom_bronze.product AS product
                GROUP BY product.category
              columns_used:
                - product.product_id
                - product.category
      
      - name: monthly_order_revenue
        business_name: Monthly Order Revenue
        description: >-
          Total order revenue aggregated by month. Used for time-series revenue analysis.
        return_type: NUMERIC
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    SUM(order_tbl.total) AS monthly_order_revenue
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.total
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Total number of orders aggregated by month. Used for time-series order volume analysis.
        return_type: INTEGER
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    COUNT(order_tbl.order_id) AS monthly_order_count
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.order_id
      
      - name: shipments_by_supplier
        business_name: Shipments By Supplier
        description: >-
          Total number of shipments grouped by supplier. Used for supplier logistics performance analysis.
        return_type: INTEGER
        result_grain: one row per supplier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    supplier.supplier_id,
                    supplier.name AS supplier_name,
                    COUNT(shipment.shipment_id) AS shipments_by_supplier
                FROM ecom_bronze.shipment AS shipment
                INNER JOIN ecom_bronze.supplier AS supplier
                    ON shipment.supplier_id = supplier.supplier_id
                GROUP BY supplier.supplier_id, supplier.name
              columns_used:
                - shipment.shipment_id
                - shipment.supplier_id
                - supplier.supplier_id
                - supplier.name
      
      - name: products_by_supplier
        business_name: Products By Supplier
        description: >-
          Total number of products grouped by supplier. Used for supplier catalog analysis.
        return_type: INTEGER
        result_grain: one row per supplier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    supplier.supplier_id,
                    supplier.name AS supplier_name,
                    COUNT(product.product_id) AS products_by_supplier
                FROM ecom_bronze.product AS product
                INNER JOIN ecom_bronze.supplier AS supplier
                    ON product.supplier_id = supplier.supplier_id
                GROUP BY supplier.supplier_id, supplier.name
              columns_used:
                - product.product_id
                - product.supplier_id
                - supplier.supplier_id
                - supplier.name