      - name: organic_product_count
        business_name: Organic Product Count
        description: >-
          Total number of organic certified products. Counts products from the product dataset where 
          is_organic is true.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT product.product_id) AS organic_product_count
                FROM ecom_bronze.product AS product
                WHERE product.is_organic = true
              columns_used:
                - product.product_id
                - product.is_organic
      
      - name: orders_per_customer
        business_name: Orders per Customer
        description: >-
          Average number of orders per customer. Calculated as total order count divided by total customer count.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT customer.customer_id) = 0 THEN 0
                        ELSE COUNT(DISTINCT order_tbl.order_id)::DECIMAL / COUNT(DISTINCT customer.customer_id)
                    END AS orders_per_customer
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.customer AS customer
                    ON order_tbl.customer_id = customer.customer_id
              columns_used:
                - order_tbl.order_id
                - order_tbl.customer_id
                - customer.customer_id
      
      - name: revenue_by_state
        business_name: Revenue by State
        description: >-
          Total revenue aggregated by store state. Joins order_tbl to store and sums order total by 
          store state. Returns one row per state.
        return_type: decimal
        result_grain: one row per state
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
