      - name: shipment_transit_time
        business_name: Shipment Transit Time
        description: >-
          Average transit time in days for shipments. Calculates the difference between arrival_date and 
          dispatch_date for each shipment and returns the average.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipment.arrival_date - shipment.dispatch_date) AS average_transit_days
                FROM ecom_bronze.shipment AS shipment
                WHERE shipment.arrival_date IS NOT NULL
                  AND shipment.dispatch_date IS NOT NULL
              columns_used:
                - shipment.arrival_date
                - shipment.dispatch_date