      - name: revenue_by_loyalty_tier
        business_name: Revenue by Loyalty Tier
        description: >-
          Total order revenue grouped by customer loyalty tier. 
          Used for customer segmentation and loyalty program analysis.
        return_type: NUMERIC
        result_grain: one row per loyalty tier
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    customers.loyalty_tier,
                    SUM(order_tbl.total) AS revenue_by_loyalty_tier
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.customer AS customers
                    ON order_tbl.customer_id = customers.customer_id
                GROUP BY customers.loyalty_tier
              columns_used:
                - order_tbl.total
                - order_tbl.customer_id
                - customers.customer_id
                - customers.loyalty_tier
      
      - name: revenue_by_product_category
        business_name: Revenue by Product Category
        description: >-
          Total order revenue grouped by product category. 
          Requires joining orders to products via order items (not available in current glossary).
          This metric is a placeholder and requires order_items dataset to be implemented.
        return_type: NUMERIC
        result_grain: one row per product category
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    product.category,
                    COUNT(*) AS placeholder_count
                FROM ecom_bronze.product AS product
                GROUP BY product.category
              columns_used:
                - product.category
      
      - name: revenue_by_store
        business_name: Revenue by Store
        description: >-
          Total order revenue grouped by store. 
          Used for store performance and geographic revenue analysis.
        return_type: NUMERIC
        result_grain: one row per store
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    store.store_id,
                    store.name,
                    SUM(order_tbl.total) AS revenue_by_store
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.store AS store
                    ON order_tbl.store_id = store.store_id
                GROUP BY store.store_id, store.name
              columns_used:
                - order_tbl.total
                - order_tbl.store_id
                - store.store_id
                - store.name
      
      - name: monthly_order_revenue
        business_name: Monthly Order Revenue
        description: >-
          Total order revenue grouped by month. 
          Used for time-series revenue trend analysis.
        return_type: NUMERIC
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    SUM(order_tbl.total) AS monthly_order_revenue
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.total
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Total number of orders grouped by month. 
          Used for time-series order volume trend analysis.
        return_type: INTEGER
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS order_month,
                    COUNT(order_tbl.order_id) AS monthly_order_count
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY order_month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.order_id
      
      - name: customer_acquisition_by_month
        business_name: Customer Acquisition by Month
        description: >-
          Total number of new customers grouped by join month. 
          Used for customer acquisition trend analysis.
        return_type: INTEGER
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', customers.join_date) AS join_month,
                    COUNT(customers.customer_id) AS customer_acquisition_by_month
                FROM ecom_bronze.customer AS customers
                GROUP BY DATE_TRUNC('month', customers.join_date)
                ORDER BY join_month
              columns_used:
                - customers.join_date
                - customers.customer_id