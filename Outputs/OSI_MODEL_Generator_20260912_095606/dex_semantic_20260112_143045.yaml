      - name: modification_age_days
        business_name: Modification Age in Days
        description: >-
          Age of each modification in days from creation date to current date.
          This metric calculates how long each modification has existed in the system.
        return_type: integer
        result_grain: one row per modification
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    mod_record.mod_id,
                    DATEDIFF(DAY, mod_record.created_date, GETDATE()) AS age_days
                FROM dbo.MOD_RECORD AS mod_record
              columns_used:
                - mod_record.mod_id
                - mod_record.created_date

      - name: modification_update_lag_days
        business_name: Modification Update Lag in Days
        description: >-
          Number of days between modification creation and last update.
          This metric indicates modification activity and staleness.
        return_type: integer
        result_grain: one row per modification
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    mod_record.mod_id,
                    DATEDIFF(DAY, mod_record.created_date, mod_record.updated_date) AS update_lag_days
                FROM dbo.MOD_RECORD AS mod_record
              columns_used:
                - mod_record.mod_id
                - mod_record.created_date
                - mod_record.updated_date

      - name: task_age_days
        business_name: Task Age in Days
        description: >-
          Age of each task in days from creation date to current date.
          This metric calculates how long each task has existed in the system.
        return_type: integer
        result_grain: one row per task
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    task_record.task_id,
                    DATEDIFF(DAY, task_record.created_date, GETDATE()) AS age_days
                FROM dbo.TASK_RECORD AS task_record
              columns_used:
                - task_record.task_id
                - task_record.created_date

      - name: modifications_created_by_month
        business_name: Modifications Created by Month
        description: >-
          Count of modifications created grouped by month.
          This metric tracks modification creation trends over time.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(mod_record.created_date) AS creation_year,
                    MONTH(mod_record.created_date) AS creation_month,
                    COUNT(DISTINCT mod_record.mod_id) AS modification_count
                FROM dbo.MOD_RECORD AS mod_record
                GROUP BY YEAR(mod_record.created_date), MONTH(mod_record.created_date)
              columns_used:
                - mod_record.mod_id
                - mod_record.created_date

      - name: tasks_created_by_month
        business_name: Tasks Created by Month
        description: >-
          Count of tasks created grouped by month.
          This metric tracks task creation trends over time.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    YEAR(task_record.created_date) AS creation_year,
                    MONTH(task_record.created_date) AS creation_month,
                    COUNT(DISTINCT task_record.task_id) AS task_count
                FROM dbo.TASK_RECORD AS task_record
                GROUP BY YEAR(task_record.created_date), MONTH(task_record.created_date)
              columns_used:
                - task_record.task_id
                - task_record.created_date
