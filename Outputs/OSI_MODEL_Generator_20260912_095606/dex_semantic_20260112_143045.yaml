      - name: tasks_per_modification
        business_name: Tasks per Modification
        description: >-
          Count of tasks for each modification.
          This metric shows the work breakdown at the modification level.
        return_type: integer
        result_grain: one row per modification
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    task_record.mod_id,
                    COUNT(DISTINCT task_record.task_id) AS task_count
                FROM dbo.TASK_RECORD AS task_record
                GROUP BY task_record.mod_id
              columns_used:
                - task_record.task_id
                - task_record.mod_id

      - name: average_tasks_per_modification
        business_name: Average Tasks per Modification
        description: >-
          Average number of tasks per modification.
          This metric indicates the typical work breakdown size for modifications.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    AVG(CAST(task_count AS DECIMAL(10,2))) AS avg_tasks_per_modification
                FROM (
                    SELECT
                        task_record.mod_id,
                        COUNT(DISTINCT task_record.task_id) AS task_count
                    FROM dbo.TASK_RECORD AS task_record
                    GROUP BY task_record.mod_id
                ) AS task_counts
              columns_used:
                - task_record.task_id
                - task_record.mod_id

      - name: total_subtasks
        business_name: Total Subtasks
        description: >-
