              expression: |
                SELECT
                    subtask.task_id,
                    COUNT(DISTINCT subtask.subtask_id) AS subtask_count
                FROM dbo.SUBTASK AS subtask
                GROUP BY subtask.task_id
              columns_used:
                - subtask.subtask_id
                - subtask.task_id

      - name: average_subtasks_per_task
        business_name: Average Subtasks per Task
        description: >-
          Average number of subtasks per task.
          This metric indicates the typical level of task detail.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    AVG(CAST(subtask_count AS DECIMAL(10,2))) AS avg_subtasks_per_task
                FROM (
                    SELECT
                        subtask.task_id,
                        COUNT(DISTINCT subtask.subtask_id) AS subtask_count
                    FROM dbo.SUBTASK AS subtask
                    GROUP BY subtask.task_id
                ) AS subtask_counts
              columns_used:
                - subtask.subtask_id
                - subtask.task_id

      - name: total_completion_gates
        business_name: Total Completion Gates
        description: >-
          Total count of completion gate records in the system.
          This metric counts all quality checkpoints across all tasks.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(DISTINCT completion_gate.gate_id) AS total_gates
                FROM dbo.COMPLETION_GATE AS completion_gate
              columns_used:
                - completion_gate.gate_id

      - name: checked_completion_gates
        business_name: Checked Completion Gates
        description: >-
          Count of completion gates that have been marked as checked (is_checked = 1).
          This metric identifies completed quality checkpoints.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    COUNT(DISTINCT completion_gate.gate_id) AS checked_gates
                FROM dbo.COMPLETION_GATE AS completion_gate
                WHERE completion_gate.is_checked = 1
              columns_used:
                - completion_gate.gate_id
                - completion_gate.is_checked

      - name: completion_gate_completion_rate
        business_name: Completion Gate Completion Rate
        description: >-
          Percentage of completion gates that have been checked.
          This metric indicates overall quality checkpoint completion progress.
          Calculated as: (checked gates / total gates) * 100
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT completion_gate.gate_id) = 0 THEN 0
                        ELSE
                            (CAST(SUM(CASE WHEN completion_gate.is_checked = 1 THEN 1 ELSE 0 END) AS DECIMAL(10,2))
                            / COUNT(DISTINCT completion_gate.gate_id)) * 100
                    END AS completion_rate_pct
                FROM dbo.COMPLETION_GATE AS completion_gate
              columns_used:
                - completion_gate.gate_id
                - completion_gate.is_checked

      - name: gates_per_task
        business_name: Gates per Task
        description: >-
          Count of completion gates for each task.
          This metric shows the quality checkpoint density at the task level.
        return_type: integer
        result_grain: one row per task
        expression:
          dialects:
            - dialect: SQL_SERVER
              expression: |
                SELECT
                    completion_gate.task_id,
                    COUNT(DISTINCT completion_gate.gate_id) AS gate_count
                FROM dbo.COMPLETION_GATE AS completion_gate
                GROUP BY completion_gate.task_id
              columns_used:
                - completion_gate.gate_id
                - completion_gate.task_id

