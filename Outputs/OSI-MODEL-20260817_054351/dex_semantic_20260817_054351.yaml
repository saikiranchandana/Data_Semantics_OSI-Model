        description: >-
          Ranking of customers by total revenue generated. Calculated by summing order totals per customer and 
          ranking in descending order. This metric identifies the most valuable customers.
        return_type: NUMERIC
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    customer.customer_id,
                    customer.name AS customer_name,
                    SUM(order_tbl.total) AS total_revenue,
                    RANK() OVER (ORDER BY SUM(order_tbl.total) DESC) AS revenue_rank
                FROM ecom_bronze.order_tbl AS order_tbl
                INNER JOIN ecom_bronze.customer AS customer
                    ON order_tbl.customer_id = customer.customer_id
                GROUP BY customer.customer_id, customer.name
                ORDER BY total_revenue DESC
              columns_used:
                - order_tbl.total
                - order_tbl.customer_id
                - customer.customer_id
                - customer.name
      
