      - name: monthly_revenue
        business_name: Monthly Revenue
        description: >-
          Total revenue aggregated by month. Calculated as the sum of order totals grouped by month extracted 
          from order timestamp. This metric enables time-series revenue analysis and trend identification.
        return_type: NUMERIC
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS month,
                    SUM(order_tbl.total) AS monthly_revenue
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.total
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Total number of orders aggregated by month. Calculated as the count of distinct orders grouped by 
          month extracted from order timestamp. This metric enables time-series order volume analysis.
        return_type: INTEGER
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', order_tbl.timestamp) AS month,
                    COUNT(DISTINCT order_tbl.order_id) AS monthly_order_count
                FROM ecom_bronze.order_tbl AS order_tbl
                GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                ORDER BY month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.order_id
      
      - name: revenue_growth_mom
        business_name: Revenue Growth Month-over-Month
        description: >-
          Month-over-month revenue growth percentage. Calculated as the percentage change in revenue compared 
          to the previous month. This metric measures revenue momentum and growth trends.
        return_type: NUMERIC
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                WITH monthly_revenue AS (
                    SELECT
                        DATE_TRUNC('month', order_tbl.timestamp) AS month,
                        SUM(order_tbl.total) AS revenue
                    FROM ecom_bronze.order_tbl AS order_tbl
                    GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                )
                SELECT
                    month,
                    revenue,
                    LAG(revenue) OVER (ORDER BY month) AS previous_month_revenue,
                    CASE
                        WHEN LAG(revenue) OVER (ORDER BY month) = 0 THEN NULL
                        WHEN LAG(revenue) OVER (ORDER BY month) IS NULL THEN NULL
                        ELSE ((revenue - LAG(revenue) OVER (ORDER BY month)) / LAG(revenue) OVER (ORDER BY month)) * 100
                    END AS revenue_growth_mom
                FROM monthly_revenue
                ORDER BY month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.total
      
      - name: running_total_revenue
        business_name: Running Total Revenue
        description: >-
          Cumulative revenue over time. Calculated as the running sum of revenue ordered by month. This metric 
          shows cumulative revenue accumulation and year-to-date performance.
        return_type: NUMERIC
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                WITH monthly_revenue AS (
                    SELECT
                        DATE_TRUNC('month', order_tbl.timestamp) AS month,
                        SUM(order_tbl.total) AS revenue
                    FROM ecom_bronze.order_tbl AS order_tbl
                    GROUP BY DATE_TRUNC('month', order_tbl.timestamp)
                )
                SELECT
                    month,
                    revenue,
                    SUM(revenue) OVER (ORDER BY month ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total_revenue
                FROM monthly_revenue
                ORDER BY month
              columns_used:
                - order_tbl.timestamp
                - order_tbl.total
      
      - name: customer_acquisition_by_month
        business_name: Customer Acquisition by Month
        description: >-
          Number of new customers acquired each month. Calculated as the count of customers grouped by the 
          month they joined. This metric measures customer acquisition rate and growth.
        return_type: INTEGER
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
