        description: >-
          Percentage of products that are certified organic. Calculated as the ratio of organic products to 
          total products multiplied by 100. This metric measures organic product penetration in the catalog.
        return_type: NUMERIC
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT product.product_id) = 0 THEN 0
                        ELSE (COUNT(DISTINCT CASE WHEN product.is_organic = true THEN product.product_id END)::NUMERIC 
                              / COUNT(DISTINCT product.product_id)) * 100
                    END AS organic_product_percentage
                FROM ecom_bronze.product AS product
              columns_used:
