                  COUNT(DISTINCT employees.employee_id) AS employee_count
                FROM semantic.employees AS employees
              columns_used:
                - employees.employee_id

      - name: store_count
        business_name: Store Count
        description: >-
          Total number of stores. Count of distinct store_id.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
