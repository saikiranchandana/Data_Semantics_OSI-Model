                FROM semantic.stores AS stores
              columns_used:
                - stores.store_id

      - name: supplier_count
        business_name: Supplier Count
        description: >-
          Total number of suppliers. Count of distinct supplier_id.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  COUNT(DISTINCT suppliers.supplier_id) AS supplier_count
                FROM semantic.suppliers AS suppliers
              columns_used:
                - suppliers.supplier_id
